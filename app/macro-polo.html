<meta name="claude:viewport-fit-sides" content="cover">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="application-name" content="Macro Polo">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first, one column, deliberately dark. Day navigation up top, big calorie figure and eating-window
   timeline as the hero, ceilings and spikes next, then the chronological log. A raised camera button sits in the
   middle of the bottom bar: photographing food is the main action. Single committed theme. */
:root{
  color-scheme:dark;
  /* Profile A (Adrian): midnight navy, electric blue, a shot of orange for streaks and scores. */
  --bg:#070C16; --bg-glow:rgba(61,139,255,.18); --surface:#0F1829; --surface-2:#162238; --surface-3:#1E2E4A; --line:#1F2E48; --line-2:#2D4264;
  --fg:#EEF3FA; --muted:#93A6C4; --faint:#5C7094;
  --accent:#3D8BFF; --accent-ink:#03101F; --accent-soft:rgba(61,139,255,.18); --accent-rgb:61,139,255; --accent-glow:0 0 0 6px rgba(61,139,255,.2),0 10px 34px rgba(61,139,255,.45);
  --accent-2:#FF7A1A; --accent-2-rgb:255,122,26; --accent-2-soft:rgba(255,122,26,.18);
  --hero-a:#142341; --hero-b:#0B1324; --hero-rgb:11,19,36; --dot-a:#3D8BFF;
  --good:#5FD39A; --warn:#F2B84B; --crit:#F0706A;
  --good-soft:rgba(95,211,154,.16); --warn-soft:rgba(242,184,75,.16); --crit-soft:rgba(240,112,106,.16);
  --protein:#3987e5; --carbs:#d95926; --fat:#9085e9; --fiber:#c98500;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Instrument Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  --radius:18px;
}
/* Profile A looks. Jungle: deep greens, highlighter lime, amber. Mint: sea green with electric blue. */
:root[data-theme-a="jungle"]{--dot-a:#9BFF3F}
:root[data-theme-a="mint"]{--dot-a:#2EE6A6}
:root[data-profile="a"][data-theme-a="jungle"]{
  --bg:#05100A; --bg-glow:rgba(155,255,63,.14); --surface:#0C1A12; --surface-2:#122419; --surface-3:#1A3123; --line:#1C3025; --line-2:#2B4737;
  --fg:#EEF7EF; --muted:#9BB8A3; --faint:#5F7E68;
  --accent:#9BFF3F; --accent-ink:#06180A; --accent-soft:rgba(155,255,63,.16); --accent-rgb:155,255,63; --accent-glow:0 0 0 6px rgba(155,255,63,.18),0 10px 34px rgba(155,255,63,.42);
  --accent-2:#FFC53D; --accent-2-rgb:255,197,61; --accent-2-soft:rgba(255,197,61,.18);
  --hero-a:#153B22; --hero-b:#0A1A10; --hero-rgb:10,26,16;
}
:root[data-profile="a"][data-theme-a="mint"]{
  --bg:#05100F; --bg-glow:rgba(46,230,166,.16); --surface:#0C1B1A; --surface-2:#122624; --surface-3:#19332F; --line:#1C302D; --line-2:#2B4843;
  --fg:#EDF7F4; --muted:#95B6AD; --faint:#5B7C74;
  --accent:#2EE6A6; --accent-ink:#04170F; --accent-soft:rgba(46,230,166,.16); --accent-rgb:46,230,166; --accent-glow:0 0 0 6px rgba(46,230,166,.18),0 10px 34px rgba(46,230,166,.42);
  --accent-2:#3D8BFF; --accent-2-rgb:61,139,255; --accent-2-soft:rgba(61,139,255,.18);
  --hero-a:#113A33; --hero-b:#0A1C1A; --hero-rgb:10,28,26;
}
/* Profile B looks. Orchid: deep plum, hot pink, lavender. Rosé: warm mauve, dusty rose, apricot. Sage: eucalyptus with blush and mint. */
:root{--dot-b:#FF5FA8;--dot-h:#E8A24A;--nav-bg:rgba(20,27,34,.92)}
/* Profile H (Home, the shared kitchen): dark like the other two, warm like a kitchen at night.
   Night market: charcoal green, copper and fresh herb. Ember: warm espresso, terracotta and saffron. Slate: cool graphite, teal and orange. */
:root[data-profile="h"]{
  color-scheme:dark;
  --bg:#0B110E; --bg-glow:rgba(232,162,74,.16); --surface:#131B17; --surface-2:#1A2520; --surface-3:#233029; --line:#223027; --line-2:#334538;
  --fg:#F3F1EA; --muted:#A5B3A8; --faint:#66766B;
  --accent:#E8A24A; --accent-ink:#1A0F03; --accent-soft:rgba(232,162,74,.18); --accent-rgb:232,162,74; --accent-glow:0 0 0 6px rgba(232,162,74,.18),0 10px 34px rgba(232,162,74,.42);
  --accent-2:#6FD39B; --accent-2-rgb:111,211,155; --accent-2-soft:rgba(111,211,155,.18);
  --hero-a:#1D2E25; --hero-b:#0F1713; --hero-rgb:15,23,19; --nav-bg:rgba(19,27,23,.92);
}
:root[data-theme-h="stone"]{--dot-h:#F07A4A}
:root[data-theme-h="slate"]{--dot-h:#2BC4C4}
:root[data-profile="h"][data-theme-h="stone"]{
  --bg:#120D0B; --bg-glow:rgba(240,122,74,.16); --surface:#1B1512; --surface-2:#251D19; --surface-3:#302621; --line:#2E241F; --line-2:#43362F;
  --fg:#F6EFE8; --muted:#B5A79B; --faint:#766A5F;
  --accent:#F07A4A; --accent-ink:#1F0C05; --accent-soft:rgba(240,122,74,.18); --accent-rgb:240,122,74; --accent-glow:0 0 0 6px rgba(240,122,74,.18),0 10px 34px rgba(240,122,74,.42);
  --accent-2:#F2C14E; --accent-2-rgb:242,193,78; --accent-2-soft:rgba(242,193,78,.18);
  --hero-a:#3A241A; --hero-b:#17100C; --hero-rgb:23,16,12; --nav-bg:rgba(27,21,18,.92);
}
:root[data-profile="h"][data-theme-h="slate"]{
  --bg:#0B1115; --bg-glow:rgba(43,196,196,.16); --surface:#111A1F; --surface-2:#182329; --surface-3:#203036; --line:#1F2E35; --line-2:#2F434C;
  --fg:#EDF4F6; --muted:#9BB0B8; --faint:#5E7580;
  --accent:#2BC4C4; --accent-ink:#04191A; --accent-soft:rgba(43,196,196,.18); --accent-rgb:43,196,196; --accent-glow:0 0 0 6px rgba(43,196,196,.18),0 10px 34px rgba(43,196,196,.42);
  --accent-2:#FF8A3D; --accent-2-rgb:255,138,61; --accent-2-soft:rgba(255,138,61,.18);
  --hero-a:#173039; --hero-b:#0D171C; --hero-rgb:13,23,28; --nav-bg:rgba(17,26,31,.92);
}
:root[data-theme-b="rose"]{--dot-b:#F28C9B}
:root[data-theme-b="sage"]{--dot-b:#F4A6C1}
:root[data-profile="b"][data-theme-b="rose"]{
  --bg:#1A0F13; --bg-glow:rgba(242,140,155,.22); --surface:#241519; --surface-2:#2F1D22; --surface-3:#3C272D; --line:#3D2930; --line-2:#523842;
  --fg:#FBF2F0; --muted:#D3B3B6; --faint:#957479;
  --accent:#F28C9B; --accent-ink:#2E0F15; --accent-soft:rgba(242,140,155,.2); --accent-rgb:242,140,155; --accent-glow:0 0 0 6px rgba(242,140,155,.22),0 10px 34px rgba(242,140,155,.5);
  --accent-2:#F6B26B; --accent-2-rgb:246,178,107; --accent-2-soft:rgba(246,178,107,.2);
  --hero-a:#4A2630; --hero-b:#22121A; --hero-rgb:34,18,26;
}
:root[data-profile="b"][data-theme-b="sage"]{
  --bg:#0F1613; --bg-glow:rgba(244,166,193,.18); --surface:#17211C; --surface-2:#1F2C25; --surface-3:#28382F; --line:#28362E; --line-2:#3A4C41;
  --fg:#F3F7F3; --muted:#B3C4B8; --faint:#728579;
  --accent:#F4A6C1; --accent-ink:#2A0E1A; --accent-soft:rgba(244,166,193,.2); --accent-rgb:244,166,193; --accent-glow:0 0 0 6px rgba(244,166,193,.22),0 10px 34px rgba(244,166,193,.5);
  --accent-2:#9FD3B3; --accent-2-rgb:159,211,179; --accent-2-soft:rgba(159,211,179,.2);
  --hero-a:#24402F; --hero-b:#13201A; --hero-rgb:19,32,26;
}
:root[data-profile="b"]{
  --bg:#150B21; --bg-glow:rgba(255,95,168,.22); --surface:#1F1232; --surface-2:#2A1A42; --surface-3:#372552; --line:#3A2755; --line-2:#4D386E;
  --fg:#FBF1FA; --muted:#C9B0DA; --faint:#8E74A8;
  --accent:#FF5FA8; --accent-ink:#2B0818; --accent-soft:rgba(255,95,168,.2); --accent-rgb:255,95,168; --accent-glow:0 0 0 6px rgba(255,95,168,.22),0 10px 34px rgba(255,95,168,.5);
  --accent-2:#B48CFF; --accent-2-rgb:180,140,255; --accent-2-soft:rgba(180,140,255,.2);
  --hero-a:#3A1C54; --hero-b:#1E1033; --hero-rgb:30,16,51;
}
.looks{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swatches.bgs .swatch i{background-size:cover}
.swatch{background:var(--surface-2);border:2px solid var(--line-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.swatch i{width:100%;height:34px;border-radius:8px;display:block}
.swatch.on{border-color:var(--accent);color:var(--fg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 420px at 50% -120px,var(--bg-glow),transparent 70%);background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body,.card,.card.hero,nav.tabs,header.top,.btn,.snap{transition:background .35s ease,border-color .35s ease,color .35s ease}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);backdrop-filter:blur(10px);
  padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{font-family:var(--display);font-weight:800;font-size:21px;margin:0;letter-spacing:-.02em;white-space:nowrap}
.brand .mark{width:28px;height:28px;flex:none;border-radius:50%;filter:drop-shadow(0 0 6px rgba(var(--accent-rgb),.45))}
.brand{align-items:center}
@media (max-width:360px){.brand .mark{display:none}}
.brand h1 span{color:var(--accent)}
.ptoggle{display:inline-flex;background:var(--surface-2);border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;flex:none}
.ptoggle button{border:none;background:transparent;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;font-family:var(--display);display:flex;align-items:center;gap:6px;transition:background .25s ease,color .25s ease;max-width:96px}
.ptoggle button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptoggle button i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ptoggle button[data-p="a"] i{background:var(--dot-a);box-shadow:0 0 6px var(--dot-a)}
.ptoggle button[data-p="b"] i{background:var(--dot-b);box-shadow:0 0 6px var(--dot-b)}
.ptoggle button[data-p="h"] i{background:var(--dot-h);box-shadow:0 0 6px var(--dot-h)}
.ptoggle button{padding:4px 8px;max-width:84px;font-size:11px;gap:5px}
.ptoggle{padding:2px;gap:1px}
.ptoggle button i{width:7px;height:7px}
@media (max-width:420px){.brand h1{font-size:18px}.ptoggle button{padding:4px 7px}}
.cookfor{display:inline-flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px}
.cookfor button{border:none;background:transparent;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.cookfor button.on{background:var(--accent);color:var(--accent-ink)}
.shop{display:flex;flex-direction:column;gap:6px}
.shop label{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:14px}
.shop label input{width:19px;height:19px;accent-color:var(--accent);flex:none}
.shop label small{color:var(--muted);margin-left:auto;font-size:11.5px}
.collage{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.collage img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--surface-3)}
.bigpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigpick button{background:var(--surface-2);border:1px solid var(--line-2);border-radius:16px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;color:var(--fg)}
.bigpick button svg{width:30px;height:30px;color:var(--accent)}
.khead h2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;margin:4px 0 0;line-height:1.05;background:linear-gradient(90deg,var(--fg),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.khead .eyebrow{color:var(--accent-2)}
.khead .stats3{margin-top:14px}
.khead .stat{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.06)}
.khead .stat .v{font-size:22px}
.khead .collage{margin-top:14px}
.khead .collage img{border:1px solid rgba(255,255,255,.08)}
.khead .btn.ghost{border-color:rgba(255,255,255,.18);background:rgba(0,0,0,.18)}
.ptoggle button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 14px var(--accent-soft)}
.ptoggle button.on i{background:var(--accent-ink);box-shadow:none}
.sync{display:flex;align-items:center;flex:none}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.on .dot{background:var(--good);box-shadow:0 0 8px var(--good)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);flex:none}
.iconbtn svg{width:18px;height:18px}

main{flex:1;padding-block:8px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;width:100%;margin:0 auto}
.view{display:flex;flex-direction:column;gap:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--nav-bg);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:1fr 78px 1fr;align-items:end}
.tabgrp{display:flex;align-items:end}.tabgrp a{flex:1}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 9px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:500;min-width:0}
nav.tabs a svg{width:21px;height:21px}
nav.tabs a.active{color:var(--accent)}
nav.tabs .snapwrap{display:flex;justify-content:center;align-items:flex-end;padding-bottom:6px;position:relative}
.talk{position:absolute;right:-6px;bottom:10px;width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .15s ease}
.talk:active{transform:scale(.92)}
.talk svg{width:18px;height:18px}
.talkbox{width:100%;min-height:96px;resize:vertical;background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:11px 12px;font-size:16px;line-height:1.4;color:var(--fg)}
.microw{display:flex;align-items:center;gap:10px;margin-top:8px}
.mic{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--accent);background:var(--surface-2);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.mic.live{background:var(--accent);color:var(--accent-ink);animation:breathe 1.4s ease-in-out infinite}
.mic svg{width:20px;height:20px}
.snap{width:64px;height:64px;border-radius:50%;background:linear-gradient(145deg,var(--accent),var(--accent-2));color:var(--accent-ink);border:none;margin-top:-28px;box-shadow:var(--accent-glow);display:flex;align-items:center;justify-content:center;transition:transform .15s ease;animation:breathe 2.6s ease-in-out infinite}
.snap:active{transform:scale(.92)}
@keyframes breathe{0%,100%{box-shadow:var(--accent-glow)}50%{box-shadow:0 0 0 10px rgba(var(--accent-rgb),.12),0 14px 40px rgba(var(--accent-rgb),.55)}}
.snap svg{width:28px;height:28px}
.snap[disabled]{opacity:.5}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.hero{background:linear-gradient(160deg,var(--hero-a),var(--hero-b));border-color:var(--line-2);position:relative;overflow:hidden}
.card.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-120px;background:radial-gradient(closest-side,rgba(var(--accent-rgb),.28),transparent);pointer-events:none}
.card.hero>*{position:relative;z-index:1}
.card.hero>.hero-art,.card.hero>.hero-cover,.card.hero>.hero-shade{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero-art canvas{width:100%;height:100%;display:block}
.hero-cover{width:100%;height:100%;object-fit:cover;opacity:.6}
.hero-shade{background:linear-gradient(180deg,rgba(var(--hero-rgb),.25),rgba(var(--hero-rgb),.9) 62%,rgba(var(--hero-rgb),.97))}
.card.hero.has-cover{min-height:300px}
.ptoggle button i.av{width:20px;height:20px;background-size:cover;background-position:center;box-shadow:none;border:1.5px solid rgba(255,255,255,.55);margin:-3px 0}
.ptoggle button.on i.av{border-color:var(--accent-ink)}

/* photos in settings */
.photos{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.pthumb{width:72px;height:54px;border-radius:10px;background:var(--surface-3) center/cover no-repeat;border:1px solid var(--line-2)}
.pthumb.round{width:54px;height:54px;border-radius:50%}
.pinfo{display:flex;flex-direction:column;gap:4px;min-width:0}
.pinfo b{font-family:var(--display);font-weight:700}

/* day score + streak */
.scorerow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.score .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.score .v{display:flex;align-items:baseline;gap:8px}
.score .v b{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.score .v .grade{font-family:var(--display);font-weight:700;font-size:14px;color:var(--fg)}
.score .bar{margin-top:7px;height:6px;background:var(--surface-3)}
.score .bar>i{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.streak{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--accent-2-soft);border-radius:14px;padding:10px 14px;min-width:84px;color:var(--accent-2)}
.streak svg{width:22px;height:22px}
.streak b{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.streak small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;text-align:center}
.streak.hot svg{animation:flicker 1.2s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(3deg)}}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.4s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:.2}}
.card h2{font-family:var(--display);font-size:16px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-family:var(--body);font-weight:400;color:var(--muted);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .d{font-family:var(--display);font-weight:700;font-size:18px;text-align:center;flex:1;letter-spacing:-.01em}
.datebar .d small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}

.hero-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media (max-width:380px){.hero-top{grid-template-columns:1fr;justify-items:center}}
.ring{width:146px;height:146px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--surface-3);stroke-width:11}
.ring .arc{fill:none;stroke:var(--accent);stroke-width:11;transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 7px rgba(var(--accent-rgb),.6))}
.ring .arc.over{stroke:var(--crit);filter:drop-shadow(0 0 6px rgba(240,112,106,.5))}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .center b{font-family:var(--display);font-size:32px;font-weight:800;line-height:1;letter-spacing:-.03em}
.ring .center span{font-size:11px;color:var(--muted);margin-top:5px;max-width:90px;line-height:1.2}
.macros{display:flex;flex-direction:column;gap:10px;width:100%;min-width:0}
.macro .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;align-items:baseline}
.macro .lbl b{font-weight:600;display:flex;align-items:center;gap:6px}
.macro .lbl b i{width:8px;height:8px;border-radius:50%;display:inline-block}
.macro .lbl .num{font-size:12px;color:var(--muted)}
.macro .lbl .num b{font-family:var(--display);font-size:14px;color:var(--fg);display:inline}
.bar{height:7px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .4s ease}

.windows{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.win{background:var(--surface-2);border-radius:12px;padding:10px 11px;min-width:0}
.win .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.win .v{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.win .v small{font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted);display:block;letter-spacing:0}
.win.live .v{color:var(--accent)}

.limits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.limits{grid-template-columns:repeat(2,1fr)}}
.limit{background:var(--surface-2);border-radius:12px;padding:10px 11px;min-width:0}
.limit .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.limit .v{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.2;margin-top:2px;letter-spacing:-.02em}
.limit .v small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:11px;letter-spacing:0}
.limit .bar{margin-top:7px}
.limit.good .bar>i{background:var(--good)} .limit.warn .bar>i{background:var(--warn)} .limit.crit .bar>i{background:var(--crit)}
.limit.crit .v{color:var(--crit)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.chip.low,.chip.normal{background:var(--good-soft);color:var(--good)}
.chip.moderate,.chip.borderline{background:var(--warn-soft);color:var(--warn)}
.chip.high,.chip.low-lab{background:var(--crit-soft);color:var(--crit)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

.entries{display:flex;flex-direction:column;gap:10px}
.entry{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:10px 12px;background:var(--surface-2)}
.entry.pending{border-style:dashed}
.entry .thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-3)}
.entry .nothumb{width:64px;height:64px;border-radius:10px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.entry .nothumb svg{width:24px;height:24px}
.entry .body{min-width:0;display:flex;flex-direction:column;gap:5px}
.entry .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.entry .name{font-weight:600;min-width:0;line-height:1.3}
.entry .time{font-family:var(--mono);font-size:12px;color:var(--accent);display:block;margin-bottom:2px}
.entry .cal{font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap;letter-spacing:-.02em;line-height:1}
.entry .cal small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:11px;letter-spacing:0}
.entry .macroline{display:flex;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.entry .macroline b{color:var(--fg);font-weight:500}
.entry .more{grid-column:1/-1}
.entry details summary{cursor:pointer;font-size:12px;color:var(--accent);font-weight:500;list-style:none}
.entry details summary::-webkit-details-marker{display:none}
.entry .items{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.entry .items li{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line-2);padding-top:4px}
.entry .analysis{margin-top:8px;font-size:13px;background:var(--surface);border-radius:10px;padding:9px 11px;border-left:3px solid var(--accent)}
.entry .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.linkbtn{background:none;border:none;color:var(--muted);font-size:12px;padding:4px 0;text-decoration:underline;text-underline-offset:2px}
.linkbtn.danger{color:var(--crit)}
.confirm{display:flex;gap:6px;align-items:center;font-size:12px}

.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:11px 18px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-2)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}

.empty{text-align:center;padding:22px 12px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--fg);font-family:var(--display);font-weight:700;font-size:16px}
.empty p{margin:0;max-width:40ch}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14px}
.steps li::marker{color:var(--accent);font-weight:700;font-family:var(--display)}

form.add{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
form.add .full{grid-column:1/-1}
form.add label,.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
form.add input,form.add select,form.add textarea,.field input,.field textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--fg);width:100%;min-width:0}
form.add .nutr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-column:1/-1}
form.add .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.notice{font-size:13px;padding:9px 11px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.notice.err{background:var(--crit-soft);color:var(--crit)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{background:transparent;border:none;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

.chart{width:100%;overflow:visible;display:block}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .target{stroke:var(--fg);stroke-width:1.5;stroke-dasharray:4 4;opacity:.6}
.chart .axis{stroke:var(--line-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tooltip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
.chartwrap{position:relative}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n{text-align:right}
table.t tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 11px;min-width:0}
.stat .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.stat .v{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.15;margin-top:3px}
.stat .v small{font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted);display:block;letter-spacing:0}

.labgroup{display:flex;flex-direction:column}
.marker{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.marker:first-child{border-top:none;padding-top:0}
.marker .n{font-weight:500}
.marker .v{font-family:var(--display);font-weight:800;font-size:17px;text-align:right;white-space:nowrap;letter-spacing:-.01em}
.marker .v small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:11px;margin-left:3px;letter-spacing:0}
.marker .range{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.marker .range .rb{flex:1;height:6px;border-radius:3px;position:relative;background:var(--surface-3)}
.marker .range .rb .ok{position:absolute;top:0;bottom:0;background:var(--good-soft);border-radius:3px}
.marker .range .rb .pin{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);transform:translateX(-50%);background:var(--good)}
.marker.high .pin,.marker.low .pin{background:var(--crit)}
.marker.borderline .pin{background:var(--warn)}
.marker .note{grid-column:1/-1;font-size:12px;color:var(--muted)}

.insight{display:flex;flex-direction:column;gap:6px}
.insight .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.insight h3{font-family:var(--display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.md p{margin:0 0 8px}
.md p:last-child{margin-bottom:0}
.md ul{margin:0 0 8px;padding-left:18px}
.md li{margin:3px 0}
.md strong{font-weight:600;color:var(--fg)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;}#pickRoot .sheet-bg{z-index:25}.sheet-bg{display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-top:1px solid var(--line-2);
  padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 12px}
.sheet h2{font-family:var(--display);font-size:19px;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.targets label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
.targets input{background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:8px;font-size:14px;width:100%;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:999px;font-size:13px;z-index:30;font-weight:500;max-width:90vw;text-align:center}

/* snap sheet */
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:14px;background:var(--surface-2);display:block}
.snapgrid{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px;align-items:end}
.stream{color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:12px;white-space:pre-wrap;max-height:120px;overflow:auto;font-family:var(--mono);font-size:11.5px}
.result{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.result .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.result .head input{font-family:var(--display);font-weight:700;font-size:17px;background:transparent;border:none;border-bottom:1px dashed var(--line-2);padding:2px 0;width:100%;min-width:0;letter-spacing:-.01em}
.result .items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13px}
.result .items li{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:5px}
.result .items li:first-child{border-top:none;padding-top:0}
.questions{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.questions b{color:var(--warn)}
.questions ul{margin:4px 0 8px;padding-left:18px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite ease-in-out;margin-right:6px}

/* edit sheet */
.edithead{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.askrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px;align-items:end}
.askrow .btn{white-space:nowrap}
.eitems{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.eitem{background:var(--surface-2);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
.eitem .top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.eitem .top input{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font-size:14px;width:100%;min-width:0;font-weight:600}
.eitem .qty input{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:13px;width:100%;min-width:0}
.eitem .tools{display:flex;gap:6px;align-items:center}
.eitem .tools button{background:var(--surface-3);border:none;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600;color:var(--fg)}
.eitem .tools button.x{color:var(--crit)}
.egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.egrid label{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.egrid input{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;font-size:13px;width:100%;min-width:0;font-family:var(--mono);text-transform:none;letter-spacing:0}
.etotals{margin-top:12px;font-size:13px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}
.etotals b{color:var(--fg)}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* bulk upload */
.bitems{display:flex;flex-direction:column;gap:10px}
.bitem{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;background:var(--surface-2);border-radius:12px;padding:10px;border:1px solid transparent}
.bitem img{width:64px;height:64px;object-fit:cover;border-radius:9px;background:var(--surface-3)}
.bitem .bb{display:flex;flex-direction:column;gap:6px;min-width:0}
.bitem select,.bitem input{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--fg);min-width:0;width:100%}
.bitem .row select,.bitem .row input{flex:1}
.bitem.done,.bitem.checked{border-color:var(--good)}
.bitem.saved{opacity:.6}
.bitem.error{border-color:var(--crit)}
.bitem .tools.x{background:var(--surface-3);border:none;border-radius:8px;width:30px;height:30px;color:var(--crit);font-weight:700}

/* kitchen */
.kgroup{margin-top:10px}
.kitems{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kitem{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 11px 6px 8px;font-size:13px;color:var(--fg);max-width:100%}
.kitem i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.kitem.g-good i{background:var(--good)}.kitem.g-ok i{background:var(--warn)}.kitem.g-avoid i{background:var(--crit)}
.kitem .q{color:var(--muted);font-size:12px}
.kitem .st{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.kitem.out{opacity:.45;text-decoration:line-through}.kitem.out .st{color:var(--crit)}
.kitem.stale{opacity:.6;border-style:dashed}
.kpick{display:flex;flex-direction:column;gap:6px}
.kp{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13px}
.kp input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.kp i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.kp.g-good i{background:var(--good)}.kp.g-ok i{background:var(--warn)}.kp.g-avoid i{background:var(--crit)}
.kp span{display:flex;flex-direction:column;min-width:0}.kp small{color:var(--muted);font-size:11.5px}
.recipes{display:flex;flex-direction:column;gap:8px}
.recipe{background:var(--surface-2);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.recipe details summary{cursor:pointer;font-size:12px;color:var(--accent);font-weight:500;list-style:none}
.recipe details summary::-webkit-details-marker{display:none}
.scans{display:flex;flex-direction:column;gap:10px}
.scan{display:grid;grid-template-columns:auto 1fr;gap:10px}
.scan img{width:56px;height:72px;object-fit:cover;border-radius:8px;background:var(--surface-3)}
.scan .b{min-width:0;display:flex;flex-direction:column;gap:4px}

/* supplements */
.supps{display:flex;flex-direction:column;gap:8px}
.supp{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:9px 10px;border:1px solid transparent}
.supp img,.supp i{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--surface-3);display:block}
.supp .b{display:flex;flex-direction:column;gap:2px;min-width:0}
.supp .b b{font-weight:600;line-height:1.25}
.supp.off{opacity:.6}
.supp.on{border-color:var(--good)}
.tick{width:36px;height:36px;border-radius:50%;border:2px solid var(--line-2);background:transparent;color:var(--accent-ink);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.supp.on .tick{background:var(--good);border-color:var(--good)}
.srow select{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;font-size:13px;width:100%;min-width:0;color:var(--fg);text-transform:none;letter-spacing:0}
.srow input[type=text],.srow input[type=date]{font-family:var(--body)}

/* coach chat */
.coachcard h2{margin-bottom:8px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:2px 0}
.msg{max-width:88%;border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.me .md p{color:inherit}
.msg.coach{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.askbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.askbar input{background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--fg);width:100%;min-width:0}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.facts li{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.facts li .linkbtn{flex:none;padding:0}

/* who: profile chip in the header, picker sheet */
.who{background:var(--surface);border:1px solid var(--line);border-radius:999px;height:38px;padding:0 12px 0 8px;display:inline-flex;align-items:center;gap:7px;color:var(--fg);font-weight:600;font-size:13px;max-width:150px}
.who .av{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:12px;color:var(--accent-ink);background:var(--accent);flex:none}
.who.pp .av{background:var(--dot-b)}
.who span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
@media (max-width:380px){.pickgrid{grid-template-columns:1fr}}
.pick{background:var(--surface-2);border:1px solid var(--line-2);border-radius:16px;padding:16px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-width:0}
.pick.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pick .av{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:17px;color:#03101F;background:#3D8BFF}
.pick.pp .av{background:var(--dot-b);color:#2B0818}
.pick b{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.pick .d{font-size:12px;color:var(--muted);line-height:1.35}
.pick.on::after{content:"on this phone";font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.pick.pp.on::after{color:var(--dot-b)}

/* suggestions card */
.card.sugg{border-color:var(--line-2)}
.card.sugg.pp{background:linear-gradient(160deg,var(--hero-a),var(--hero-b))}
.sugg .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.sugg h2{margin:0}
.moves{display:flex;flex-direction:column;gap:8px}
.move{background:var(--surface-2);border-radius:14px;padding:11px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;min-width:0;border:1px solid transparent}
.move.done{border-color:var(--good);opacity:.85}
.move .t{font-weight:600;line-height:1.3;min-width:0}
.move .t .cat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.move .t .cat i{width:7px;height:7px;border-radius:50%;display:inline-block}
.move .meta{font-size:12px;color:var(--muted);grid-column:1}
.move .acts{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.move .acts a,.move .acts button{font-size:12px;font-weight:600;padding:7px 11px;border-radius:9px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.move .acts a{background:var(--accent);color:var(--accent-ink)}
.move .acts a svg{width:13px;height:13px}
.move .acts button{background:var(--surface-3);border:1px solid var(--line-2);color:var(--fg)}
.move.done .acts button{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.move .alt{font-size:11px;color:var(--faint);grid-column:1}
.move .alt a{color:var(--muted)}
.c-breath{color:#7fd0f0}.c-core{color:#f0a06a}.c-yoga{color:#c99af5}.c-stretch{color:#5fd39a}.c-walk{color:#f2d04b}
.c-breath i{background:#7fd0f0}.c-core i{background:#f0a06a}.c-yoga i{background:#c99af5}.c-stretch i{background:#5fd39a}.c-walk i{background:#f2d04b}
.nudges{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.nudges li{display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.nudges li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;margin-top:7px}
.nudges li.warn::before{background:var(--warn)}
.nudges li.crit::before{background:var(--crit)}
.nudges li.good::before{background:var(--good)}
.water{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:12px;padding:9px 12px;margin-top:12px}
.water .cups{display:flex;gap:3px;flex-wrap:wrap}
.water .cups i{width:9px;height:14px;border-radius:2px 2px 4px 4px;background:var(--surface-3);display:inline-block}
.water .cups i.on{background:#7fd0f0}
.water .ctl{display:flex;gap:6px;align-items:center}
.water .ctl button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-3);color:var(--fg);font-weight:700;font-size:16px;line-height:1}
.flag{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.4}
.flag b{color:var(--warn)}
.libgroup h3{font-family:var(--display);font-size:14px;margin:14px 0 6px;letter-spacing:.02em}
.ppform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ppform .full{grid-column:1/-1}
.ppform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.ppform input[type=text],.ppform input[type=date],.ppform select{background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--fg);width:100%;min-width:0}
.ppform label.chk{flex-direction:row;align-items:center;gap:8px;font-size:13.5px;color:var(--fg);background:var(--surface-2);border-radius:10px;padding:9px 11px}
.ppform label.chk input{width:18px;height:18px;accent-color:var(--accent)}
</style>

function entryTotals(e){
  const t={};
  if(Array.isArray(e.items)&&e.items.length){for(const n of NUTR)t[n.k]=e.items.reduce((a,it)=>a+num(it[n.k]),0)}
  else{const src=e.totals||e;for(const n of NUTR)t[n.k]=num(src[n.k])}

}

function dayTotals(date){const t={};for(const n of NUTR)t[n.k]=0;for(const e of dayEntries(date)){const et=entryTotals(e);for(const n of NUTR)t[n.k]+=et[n.k]}return t}

// Eating window and fasts, from entry times.
function dayWindow(date){
  const ts=dayEntries(date).map(e=>mins(e.time)).filter(v=>v!=null);
  if(!ts.length) return null;
  const first=Math.min(...ts),last=Math.max(...ts);
  const prev=dayEntries(shiftDate(date,-1)).map(e=>mins(e.time)).filter(v=>v!=null);
  const overnight=prev.length?(24*60-Math.max(...prev))+first:null;
  return {first,last,len:last-first,overnight,count:ts.length};
}
function fastingNow(){
  const now=new Date();const nowM=now.getHours()*60+now.getMinutes();
  const t=dayEntries(todayStr()).map(e=>mins(e.time)).filter(v=>v!=null&&v<=nowM);
  if(t.length) return nowM-Math.max(...t);
  const y=dayEntries(shiftDate(todayStr(),-1)).map(e=>mins(e.time)).filter(v=>v!=null);
  if(y.length) return 24*60-Math.max(...y)+nowM;
  return null;
}

// Blood-sugar impact estimate: net carbs x estimated glycemic index, dampened by fiber, protein and fat.
function glycemic(e){
  if(e.glycemic&&e.glycemic.impact) return {gl:num(e.glycemic.gl),impact:e.glycemic.impact,note:e.glycemic.note||'',est:false};
  const t=entryTotals(e);const net=Math.max(0,t.carbs-t.fiber);
  if(net<3) return {gl:0,impact:'low',note:'',est:true};
  let gi=50+35*Math.min(1,t.sugar/Math.max(t.carbs,1))-2.5*t.fiber-0.25*t.protein-0.2*t.fat;gi=Math.max(20,Math.min(90,gi));
  const gl=Math.round(net*gi/100);return {gl,impact:gl<10?'low':gl<20?'moderate':'high',note:'',est:true};
}

// ---------- day score, streak, celebration ----------
function dayScore(t,tg){
  const parts=[];const clamp=v=>Math.max(0,Math.min(100,v));
  const calR=tg.cal?t.cal/tg.cal:0;parts.push(clamp(100-Math.abs(calR-1)*250));
  for(const k of ['protein','fiber']){const r=tg[k]?t[k]/tg[k]:0;parts.push(clamp(r*100))}
  for(const k of ['sugar','satfat','chol','sodium']){const r=tg[k]?t[k]/tg[k]:0;parts.push(r<=0.8?100:r<=1?100-(r-0.8)*200:clamp(60-(r-1)*120))}
  const score=Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
  const grade=score>=90?'Elite':score>=75?'Strong':score>=60?'Solid':score>=40?'Shaky':'Rough';
  return {score,grade};
}
function streak(){
  let d=todayStr();if(!dayEntries(d).length)d=shiftDate(d,-1);let n=0;
  while(dayEntries(d).length&&n<365){n++;d=shiftDate(d,-1)}return n;
}
const lastShown={};
function countUp(el){
  const key=el.id||el.dataset.key;const to=+el.dataset.v;const from=lastShown[key]==null?Math.round(to*0.6):lastShown[key];lastShown[key]=to;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce||from===to){el.textContent=to.toLocaleString();return}
  const t0=performance.now(),dur=650;
  (function step(now){const p=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-p,3);el.textContent=Math.round(from+(to-from)*e).toLocaleString();if(p<1)requestAnimationFrame(step)})(t0);
}
function celebrate(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cs=getComputedStyle(document.documentElement);const cols=[cs.getPropertyValue('--accent'),cs.getPropertyValue('--accent-2'),cs.getPropertyValue('--good'),cs.getPropertyValue('--warn'),'#ffffff'];
  const box=document.createElement('div');box.className='confetti';
  for(let i=0;i<48;i++){const p=document.createElement('i');p.style.left=(Math.random()*100)+'%';p.style.background=cols[i%cols.length].trim();p.style.animationDelay=(Math.random()*.35)+'s';p.style.animationDuration=(1.1+Math.random()*.7)+'s';p.style.transform='rotate('+(Math.random()*360)+'deg)';box.appendChild(p)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2300);
}

  </div>

  </div>

}

// --- Suggestions: the first thing on the Today screen for either person ---
function pickMoves(date){
  const q=pp();const wk=weeksPP();const seed=hashStr(date+':'+S.shuffle);
  const ok=MOVES.filter(m=>wk>=m.minWeek&&(q.cleared||['breath','stretch','walk'].includes(m.cat)));
  const even=(hashStr(date)%2)===0;
  const plan=even?['core','yoga','walk']:['breath','stretch','walk'];
  const out=[];
  plan.forEach((cat,i)=>{let pool=ok.filter(m=>m.cat===cat);if(!pool.length)pool=ok.filter(m=>!out.includes(m));if(!pool.length)return;const m=pool[(seed+i*7919)%pool.length];if(m&&!out.includes(m))out.push(m)});
  return out;
}
function moveCard(m,done){
  const cat=m.cat?CATS[m.cat]:'';
  return h`<div class="move ${done?'done':''}">
    <div class="t">${cat?h`<span class="cat c-${m.cat}"><i></i>${esc(cat)}</span><br>`:''}${esc(m.title)}</div>
    <div class="meta">${m.mins?m.mins+' min · ':''}${esc(m.by||m.meta||'')}${m.note?' · '+esc(m.note):''}</div>
    <div class="acts">${m.yt?h`<a href="${esc(ytUrl(m.yt))}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Watch</a>`:''}<button type="button" data-act="done" data-id="${esc(m.id)}">${done?'Done ✓':'Mark done'}</button></div>
    ${m.yt?h`<div class="alt">Video missing? <a href="${esc(ytSearch(m.title))}" target="_blank" rel="noopener">search for it</a></div>`:''}
  </div>`;
}
function suggestions(date,t,tg,entries,isToday){
  const dd=dayDoc(date);const done=Array.isArray(dd.moves)?dd.moves:[];const left=k=>Math.max(0,tg[k]-t[k]);
  if(isPP()){
    const q=pp();const wk=weeksPP();const picks=pickMoves(date);const goal=waterGoal();const water=num(dd.water);
    const nudges=[];
    if(q.breastfeeding)nudges.push({c:'',t:'Breastfeeding burns about 400 kcal a day. Your target is '+tg.cal.toLocaleString()+' kcal; '+(t.cal<tg.cal*0.5&&mins(nowTime())>14*60&&isToday?'you are well under it so far today. Eat.':'under-eating costs supply and energy before it costs weight.')});
    nudges.push({c:left('protein')>tg.protein*0.4?'warn':'good',t:left('protein')>0?r0(left('protein'))+' g of protein still to go. Eggs, Greek yogurt, chicken, beans and cottage cheese are the easy ones.':'Protein floor reached. Nice.'});
    if(left('fiber')>tg.fiber*0.4)nudges.push({c:'',t:'Fiber is at '+r0(t.fiber)+' of '+tg.fiber+' g. Oats, berries, beans and a big handful of greens get you there and help postpartum digestion.'});
    const rot=['Iron day: red meat, lentils or spinach with something citrus. Blood loss at delivery plus night feeds make low iron the usual reason for the wall of tiredness.','Calcium check: three servings of dairy or fortified alternatives. Breastfeeding pulls calcium from bone if the plate does not supply it.','Omega-3: salmon or sardines twice a week, or walnuts and chia today. DHA goes straight into milk.','Choline and vitamin D: eggs cover the first, a supplement usually covers the second. Ask your provider what dose.'];
    nudges.push({c:'',t:rot[hashStr(date)%rot.length]});
    const cups=Array.from({length:goal},(_,i)=>h`<i class="${i<water?'on':''}"></i>`).join('');
    return h`<div class="card sugg pp">
      <div class="head"><div><div class="eyebrow" style="color:var(--accent-2)">Week ${wk} postpartum · baby no. 4</div><h2 style="margin-top:4px">Today's movement<span class="sub">pick one, two if you feel good</span></h2></div>
        <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="iconbtn" data-act="shuffle" aria-label="Other options" title="Other options"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button><button class="btn ghost sm" data-act="lib">${S.libOpen?'Less':'All'}</button></div></div>
      ${q.cleared?'':h`<div class="notice warn" style="margin-bottom:10px">Core and yoga stay hidden until you flip "cleared by my provider" in settings. Breath, stretches and walks are safe now.</div>`}
      <div class="moves">${picks.map(m=>moveCard(m,done.includes(m.id))).join('')}</div>
      ${S.libOpen?library(done):''}
      <p class="flag"><b>Stop and call your provider</b> if bleeding gets heavier or turns bright red again, you feel heaviness or pressure in the pelvis, you leak with the move, or anything hurts rather than works. Pelvic floor physio is worth asking for after a fourth baby even when nothing is wrong.</p>
      <div class="water"><div><div class="eyebrow">Water</div><div class="small"><b class="num">${water}</b> of ${goal} cups${q.breastfeeding?' · nursing':''}</div><div class="cups" style="margin-top:5px">${cups}</div></div><div class="ctl"><button type="button" data-act="water" data-n="-1" aria-label="One cup less">−</button><button type="button" data-act="water" data-n="1" aria-label="One cup more">+</button></div></div>
      <ul class="nudges">${nudges.map(n=>h`<li class="${n.c}">${esc(n.t)}</li>`).join('')}</ul>
    </div>`;
  }
  // Heart profile: nutrition nudges from today's numbers plus one movement pick.
  const nudges=[];const lab=S.labs[0];
  if(left('protein')>0)nudges.push({c:left('protein')>tg.protein*0.5&&mins(nowTime())>15*60&&isToday?'warn':'',t:r0(left('protein'))+' g of protein left to reach '+tg.protein+'. '+(left('protein')>60?'That is two solid servings: a chicken breast and a Greek yogurt get you there.':'One more protein-first meal does it.')});
  else nudges.push({c:'good',t:'Protein floor hit for the day.'});
  if(t.chol>tg.chol*0.8)nudges.push({c:t.chol>tg.chol?'crit':'warn',t:'Cholesterol is at '+r0(t.chol)+' of '+tg.chol+' mg. Keep the rest of the day egg-free and lean.'});
  else nudges.push({c:'',t:'Cholesterol budget: '+r0(left('chol'))+' mg left. One egg is about 185 mg; a 6 oz chicken breast about 145.'});
  if(t.satfat>tg.satfat*0.8)nudges.push({c:t.satfat>tg.satfat?'crit':'warn',t:'Saturated fat is '+r0(t.satfat)+' of '+tg.satfat+' g. Cheese, butter and fatty cuts are the usual culprits with an ApoB of '+(lab?'170':'yours')+'.'});
  if(left('fiber')>10)nudges.push({c:'',t:'Fiber: '+r0(t.fiber)+' of '+tg.fiber+' g. Oats, beans, lentils and psyllium are the ones that move LDL.'});
  const win=dayWindow(date);if(win&&win.len>10*60)nudges.push({c:'warn',t:'Eating window is already '+fmtDur(win.len)+'. Closing it by 8 pm keeps the overnight fast past 12 hours.'});
  const mv=HEART_MOVES[(hashStr(date+':'+S.shuffle))%HEART_MOVES.length];
  return h`<div class="card sugg">
    <div class="head"><h2>Today's suggestions<span class="sub">from your numbers and your bloodwork</span></h2><button class="iconbtn" data-act="shuffle" aria-label="Another movement option" title="Another option"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button></div>
    <div class="moves">${moveCard(mv,done.includes(mv.id))}</div>
    <ul class="nudges">${nudges.slice(0,4).map(n=>h`<li class="${n.c}">${esc(n.t)}</li>`).join('')}</ul>
  </div>`;
}
function library(done){
  const q=pp();const wk=weeksPP();
  return Object.keys(CATS).map(cat=>{const items=MOVES.filter(m=>m.cat===cat);if(!items.length)return'';
    return h`<div class="libgroup"><h3 class="c-${cat}">${esc(CATS[cat])}</h3><div class="moves">${items.map(m=>{const locked=wk<m.minWeek||(!q.cleared&&!['breath','stretch','walk'].includes(cat));return locked?h`<div class="move" style="opacity:.5"><div class="t">${esc(m.title)}</div><div class="meta">${m.mins} min · ${wk<m.minWeek?'from week '+m.minWeek:'after provider clearance'}</div></div>`:moveCard(m,done.includes(m.id))}).join('')}</div></div>`}).join('');
}

// --- Supplements: what each person takes, due today or not, ticked off per day ---
const SCHED={daily:'Every day',alt:'Every other day',asneeded:'As needed'};const WHEN={morning:'Morning',midday:'Midday',night:'Night'};
function dayNum(d){const [y,m,dd]=d.split('-').map(Number);return Math.round(new Date(y,m-1,dd).getTime()/864e5)}
function suppDue(sp,date){if(sp.schedule==='alt'){const a=dayNum(sp.start||date);return ((dayNum(date)-a)%2+2)%2===0}return sp.schedule!=='asneeded'}
function suppUrl(sp){return sp.photoId?'/_blob/'+encodeURIComponent(sp.photoId):''}
function suppCard(date,isToday){
  const dd=dayDoc(date);const taken=Array.isArray(dd.supps)?dd.supps:[];
  if(!S.supps.length)return h`<div class="card"><div class="row between"><h2 style="margin:0">Supplements<span class="sub">vitamins and minerals</span></h2><button class="btn ghost sm" data-act="supps">Add</button></div><p class="small muted" style="margin:8px 0 0">Nothing listed yet. Add what ${esc(dispName(me()))} takes and tick it off each day.</p></div>`;
  const due=S.supps.filter(sp=>suppDue(sp,date));const done=due.filter(sp=>taken.includes(sp.id)).length;
  return h`<div class="card"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Supplements<span class="sub">${done} of ${due.length} due ${isToday?'today':'that day'} taken</span></h2><button class="btn ghost sm" data-act="supps">Manage</button></div>
    <div class="supps">${S.supps.map(sp=>{const isDue=suppDue(sp,date);const on=taken.includes(sp.id);const url=suppUrl(sp);
      return h`<div class="supp ${on?'on':''} ${isDue?'':'off'}">${url?h`<img src="${esc(url)}" alt="">`:h`<i></i>`}
        <div class="b"><b>${esc(sp.name)}</b><span class="tiny muted">${esc(sp.dose||'')}${sp.dose?' · ':''}${SCHED[sp.schedule]||'Every day'}${sp.time?' · '+WHEN[sp.time]:''}${sp.reminder?' · <span style="color:var(--accent)">email reminder</span>':''}</span>${sp.note?h`<span class="tiny muted">${esc(sp.note)}</span>`:''}${!isDue&&sp.schedule==='alt'?h`<span class="tiny muted">Not due ${isToday?'today':'this day'}; next ${esc(fmtShort(shiftDate(date,1)))}.</span>`:''}</div>
        <button type="button" class="tick" data-act="supp" data-id="${esc(sp.id)}" aria-label="${on?'Taken':'Mark taken'}">${on?'✓':''}</button></div>`}).join('')}</div></div>`;
}

  root.innerHTML=h`<div class="sheet-bg" id="spBg"><div class="sheet" role="dialog" aria-label="Supplements"><div class="grab"></div>
    <h2>${esc(dispName(me()))}'s supplements</h2>

    <div class="eitems" id="spList" style="margin-top:0">${list.map(rowHtml).join('')}</div>

  const read=()=>{root.querySelectorAll('.srow').forEach((row,i)=>{const sp=list[i];if(!sp)return;for(const f of ['name','dose','schedule','time','start','note'])sp[f]=row.querySelector('[data-f='+f+']').value})};

}

function timeline(entries,win,isToday){
  // 24h strip. Eating window shaded, one dot per entry sized by calories, colored by spike.
  const W=chartW(),H=58,padL=8,padR=8;
  const times=entries.map(e=>mins(e.time)).filter(v=>v!=null);
  let start=5*60,end=24*60;
  if(times.length){start=Math.min(start,Math.floor(Math.min(...times)/60)*60);}
  const x=m=>padL+(W-padL-padR)*(m-start)/(end-start);
  const y=24;
  const ticks=[];for(let m=Math.ceil(start/180)*180;m<=end;m+=180)ticks.push(m);
  const tickHtml=ticks.map(m=>h`<line x1="${x(m).toFixed(1)}" x2="${x(m).toFixed(1)}" y1="${y-6}" y2="${y+6}" class="axis"/><text x="${x(m).toFixed(1)}" y="${H-4}" text-anchor="middle">${m>=1440?'12am':(m/60)%12===0?'12pm':((m/60)%12)+(m<720?'am':'pm')}</text>`).join('');
  const band=win?h`<rect x="${x(win.first).toFixed(1)}" y="${y-9}" width="${Math.max(4,x(win.last)-x(win.first)).toFixed(1)}" height="18" rx="9" fill="var(--accent-soft)"/>`:'';
  const nowM=(()=>{const d=new Date();return d.getHours()*60+d.getMinutes()})();
  const nowLine=isToday&&nowM>=start?h`<line x1="${x(nowM).toFixed(1)}" x2="${x(nowM).toFixed(1)}" y1="${y-16}" y2="${y+16}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".6"/><text x="${x(nowM).toFixed(1)}" y="${y-19}" text-anchor="middle" style="fill:var(--fg)">now</text>`:'';
  const dots=entries.map(e=>{const m=mins(e.time);if(m==null)return'';const cal=entryTotals(e).cal;const rr=Math.max(5,Math.min(11,4+cal/90));const g=glycemic(e);const col={low:'var(--good)',moderate:'var(--warn)',high:'var(--crit)'}[g.impact];
    return h`<circle cx="${x(m).toFixed(1)}" cy="${y}" r="${rr.toFixed(1)}" fill="${col}" stroke="var(--surface)" stroke-width="2"><title>${esc(fmtTime(e.time))} ${esc(e.name||'')} · ${r0(cal)} kcal</title></circle>`}).join('');
  return h`<svg class="chart" viewBox="0 0 ${W} ${H}" style="margin-top:14px" aria-label="Meal times across the day"><line class="axis" x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}"/>${tickHtml}${band}${dots}${nowLine}</svg>`;
}

function spikeChart(spikes){
  const W=chartW(),H=130,padL=28,padR=8,padT=16,padB=28;
  const max=Math.max(25,...spikes.map(s=>s.g.gl));const n=spikes.length;const bw=Math.min(52,(W-padL-padR)/n-8);
  const y=v=>padT+(H-padT-padB)*(1-v/max);
  const bars=spikes.map((s,i)=>{const x=padL+(W-padL-padR)*(i+0.5)/n-bw/2;const col={low:'var(--good)',moderate:'var(--warn)',high:'var(--crit)'}[s.g.impact];
    return h`<g><rect x="${x.toFixed(1)}" y="${y(s.g.gl).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,y(0)-y(s.g.gl)).toFixed(1)}" rx="4" fill="${col}"><title>${esc(s.e.name)}: GL ${s.g.gl}</title></rect>
      <text x="${(x+bw/2).toFixed(1)}" y="${(y(s.g.gl)-5).toFixed(1)}" text-anchor="middle" style="fill:var(--fg);font-weight:600">${s.g.gl}</text>
      <text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(fmtTime(s.e.time)||'–')}</text></g>`}).join('');
  const lines=[10,20].filter(v=>v<max).map(v=>h`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${padL-4}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`).join('');
  return h`<svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="Estimated glycemic load per meal">${lines}<line class="axis" x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}"/>${bars}</svg>
  <div class="legend"><span><i style="background:var(--good)"></i>under 10 low</span><span><i style="background:var(--warn)"></i>10 to 20 moderate</span><span><i style="background:var(--crit)"></i>over 20 high</span></div>`;
}

function entryList(entries){return h`<div class="entries">${entries.map(entryCard).join('')}</div>`}

// --- Trends ---
function lastDays(n){const out=[];for(let i=n-1;i>=0;i--)out.push(shiftDate(todayStr(),-i));return out}
function renderTrends(){
  const days=lastDays(S.range);const tg=targets();
  const rows=days.map(d=>({d,t:dayTotals(d),n:dayEntries(d).length,w:dayWindow(d)}));
  const logged=rows.filter(r=>r.n>0);
  const avg={};for(const n of NUTR)avg[n.k]=logged.length?logged.reduce((a,r)=>a+r.t[n.k],0)/logged.length:0;
  const wins=rows.filter(r=>r.w&&r.w.count>1);const avgWin=wins.length?wins.reduce((a,r)=>a+r.w.len,0)/wins.length:null;
  const fasts=rows.filter(r=>r.w&&r.w.overnight!=null);const avgFast=fasts.length?fasts.reduce((a,r)=>a+r.w.overnight,0)/fasts.length:null;
  const tight=wins.filter(r=>r.w.len<=8*60).length;
  const seg=[7,14,30].map(n=>h`<button class="${S.range===n?'on':''}" data-act="range" data-n="${n}">${n}d</button>`).join('');
  const tableRows=NUTR.map(n=>{const v=avg[n.k],g=tg[n.k];let cls='',verdict='';
    if(logged.length){const r=g?v/g:0;
      if(n.kind==='ceiling'){cls=ratioClass(v,g);verdict=r<0.8?'under':r<1?'close':'over'}
      else if(n.kind==='floor'){cls=r>=1?'good':r>=0.8?'warn':'crit';verdict=r>=1?'hit':r>=0.8?'close':'short'}
      else{cls=r<=1.05&&r>=0.85?'good':r<=1.15&&r>=0.7?'warn':'crit';verdict=r>1.05?'over':r<0.85?'under':'on target'}}
    return h`<tr><td>${n.l}</td><td class="n num">${logged.length?fmtN(v,n.u):'–'}</td><td class="n num muted">${fmtN(g,n.u)} ${n.u}</td><td>${verdict?h`<span class="chip ${cls==='good'?'normal':cls==='warn'?'borderline':'high'}">${verdict}</span>`:''}</td></tr>`}).join('');
  return h`
  <div class="row between"><h2 style="font-family:var(--display);font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em">Trends</h2><div class="seg">${seg}</div></div>
  <div class="card hero"><h2>Eating windows<span class="sub">first bite to last bite, each day</span></h2>
    <div class="stats3">
      <div class="stat"><div class="k">Avg window</div><div class="v">${avgWin!=null?fmtDur(avgWin):'–'}<small>${wins.length} days</small></div></div>
      <div class="stat"><div class="k">Avg overnight</div><div class="v">${avgFast!=null?fmtDur(avgFast):'–'}<small>fast</small></div></div>
      <div class="stat"><div class="k">Under 8h</div><div class="v">${wins.length?tight:'–'}<small>of ${wins.length||0} days</small></div></div>
    </div>
    ${wins.length||logged.length?h`<div class="chartwrap">${windowChart(rows)}</div>`:h`<p class="small muted" style="margin:10px 0 0">Log a couple of days and the windows show up here.</p>`}</div>
  <div class="card"><h2>Calories per day<span class="sub">dashed line is your ${tg.cal.toLocaleString()} kcal target</span></h2>
    ${logged.length?h`<div class="chartwrap">${calChart(rows,tg.cal)}</div>`:h`<p class="small muted" style="margin:0">No meals logged in this window yet.</p>`}</div>
  <div class="card"><h2>Macros per day<span class="sub">grams</span></h2>
    ${logged.length?h`<div class="chartwrap">${macroChart(rows)}</div><div class="legend"><span><i style="background:var(--protein)"></i>Protein</span><span><i style="background:var(--carbs)"></i>Carbs</span><span><i style="background:var(--fat)"></i>Fat</span></div>`:h`<p class="small muted" style="margin:0">No meals logged in this window yet.</p>`}</div>
  <div class="card"><h2>Daily averages<span class="sub">${logged.length} of ${days.length} days logged</span></h2>
    <div class="scroll"><table class="t"><thead><tr><th>Nutrient</th><th style="text-align:right">Avg</th><th style="text-align:right">Target</th><th></th></tr></thead><tbody>${tableRows}</tbody></table></div></div>`;
}
function windowChart(rows){
  const W=chartW(),padL=46,padR=8,rowH=rows.length>14?10:18,padT=18,padB=8;const H=padT+rowH*rows.length+padB;
  const start=4*60,end=24*60;const x=m=>padL+(W-padL-padR)*(m-start)/(end-start);
  const ticks=[];for(let m=start+120;m<=end;m+=240)ticks.push(m);
  const tickHtml=ticks.map(m=>h`<line class="grid" x1="${x(m).toFixed(1)}" x2="${x(m).toFixed(1)}" y1="${padT-4}" y2="${H-padB}"/><text x="${x(m).toFixed(1)}" y="${padT-8}" text-anchor="middle">${(m/60)%12===0?12:(m/60)%12}${m<720?'a':'p'}</text>`).join('');
  const every=rows.length>14?Math.ceil(rows.length/6):(rows.length>7?2:1);
  const bars=rows.map((r,i)=>{const yy=padT+rowH*i+rowH/2;const lbl=i%every===0||i===rows.length-1?h`<text x="${padL-6}" y="${(yy+4).toFixed(1)}" text-anchor="end">${esc(fmtShort(r.d))}</text>`:'';
    if(!r.w)return lbl;
    const x1=x(Math.max(start,r.w.first)),x2=x(r.w.last);const tip=esc(fmtShort(r.d))+': '+esc(fmtTime(minsToTime(r.w.first)))+' to '+esc(fmtTime(minsToTime(r.w.last)))+' ('+fmtDur(r.w.len)+')';
    const col=r.w.len<=8*60?'var(--accent)':r.w.len<=11*60?'var(--warn)':'var(--crit)';
    return lbl+h`<g data-tip="${tip}"><rect x="${x1.toFixed(1)}" y="${(yy-rowH*0.3).toFixed(1)}" width="${Math.max(6,x2-x1).toFixed(1)}" height="${(rowH*0.6).toFixed(1)}" rx="${(rowH*0.3).toFixed(1)}" fill="${col}"/></g>`}).join('');
  return h`<svg class="chart" viewBox="0 0 ${W} ${H}" style="margin-top:12px" aria-label="Eating window per day">${tickHtml}${bars}</svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>8h or less</span><span><i style="background:var(--warn)"></i>8 to 11h</span><span><i style="background:var(--crit)"></i>over 11h</span></div>`;
}
function calChart(rows,target){
  const W=chartW(),H=170,padL=40,padR=8,padT=12,padB=26;
  const max=Math.max(target*1.15,...rows.map(r=>r.t.cal))*1.05;const n=rows.length;const slot=(W-padL-padR)/n;const bw=Math.max(4,Math.min(28,slot-4));
  const y=v=>padT+(H-padT-padB)*(1-v/max);const ticks=niceTicks(max,4);
  const grid=ticks.map(v=>h`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${padL-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${v.toLocaleString()}</text>`).join('');
  const every=n>14?Math.ceil(n/7):(n>7?2:1);
  const bars=rows.map((r,i)=>{const x=padL+slot*i+(slot-bw)/2;const v=r.t.cal;const col=r.n?(v>target?'var(--crit)':'var(--accent)'):'var(--surface-3)';const hh=Math.max(r.n?2:0,y(0)-y(v));
    return h`<g data-tip="${esc(fmtShort(r.d))}: ${r0(v).toLocaleString()} kcal${r.n?'':' (not logged)'}"><rect x="${x.toFixed(1)}" y="${(y(0)-hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="3" fill="${col}"/><rect x="${(padL+slot*i).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${H-padT-padB}" fill="transparent"/>${i%every===0?h`<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(fmtShort(r.d))}</text>`:''}</g>`}).join('');
  return h`<svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="Calories per day">${grid}<line class="axis" x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}"/>${bars}<line class="target" x1="${padL}" x2="${W-padR}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}"/></svg>`;
}
function macroChart(rows){
  const W=chartW(),H=170,padL=40,padR=8,padT=12,padB=26;const keys=[['protein','var(--protein)'],['carbs','var(--carbs)'],['fat','var(--fat)']];
  const max=Math.max(50,...rows.map(r=>r.t.protein+r.t.carbs+r.t.fat))*1.08;const n=rows.length;const slot=(W-padL-padR)/n;const bw=Math.max(4,Math.min(28,slot-4));
  const y=v=>padT+(H-padT-padB)*(1-v/max);const ticks=niceTicks(max,4);
  const grid=ticks.map(v=>h`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${padL-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${v}g</text>`).join('');
  const every=n>14?Math.ceil(n/7):(n>7?2:1);
  const bars=rows.map((r,i)=>{const x=padL+slot*i+(slot-bw)/2;let acc=0;let segs='';
    for(const [k,col] of keys){const v=r.t[k];if(v<=0)continue;const y1=y(acc+v),y0=y(acc);segs+=h`<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,y0-y1-2).toFixed(1)}" rx="2" fill="${col}"/>`;acc+=v}
    return h`<g data-tip="${esc(fmtShort(r.d))}: P ${r0(r.t.protein)}g, C ${r0(r.t.carbs)}g, F ${r0(r.t.fat)}g"><rect x="${(padL+slot*i).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${H-padT-padB}" fill="transparent"/>${segs}${i%every===0?h`<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(fmtShort(r.d))}</text>`:''}</g>`}).join('');
  return h`<svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="Protein, carbs and fat per day">${grid}<line class="axis" x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}"/>${bars}</svg>`;
}
function niceTicks(max,count){const raw=max/count;const p=Math.pow(10,Math.floor(Math.log10(raw)));const step=[1,2,2.5,5,10].map(m=>m*p).find(s=>s>=raw)||raw;const out=[];for(let v=step;v<=max;v+=step)out.push(Math.round(v));return out}
function wireChart(wrap){
  let tip=null;
  wrap.addEventListener('pointerover',ev=>{const g=ev.target.closest('[data-tip]');if(!g)return;if(!tip){tip=document.createElement('div');tip.className='tooltip';wrap.appendChild(tip)}tip.textContent=g.dataset.tip;const r=g.getBoundingClientRect(),w=wrap.getBoundingClientRect();tip.style.left=(r.left-w.left+r.width/2)+'px';tip.style.top=(r.top-w.top)+'px';tip.hidden=false});
  wrap.addEventListener('pointerout',ev=>{if(tip&&!(ev.relatedTarget&&ev.relatedTarget.closest&&ev.relatedTarget.closest('[data-tip]')))tip.hidden=true});
}

// --- Kitchen: shared inventory from fridge and receipt scans, recipes from what is on hand ---
const KCATS={produce:'Produce',protein:'Meat, fish, eggs',dairy:'Dairy',grains:'Grains & bread',pantry:'Pantry & canned',snacks:'Snacks & sweets',drinks:'Drinks',frozen:'Frozen',condiments:'Condiments & oils',other:'Other'};
const KGRADE={good:'good',ok:'ok',avoid:'avoid'};
function houseRules(){
  if(S.khouse&&S.khouse.text)return S.khouse.text;
  return 'Adrian: ApoB 170 and LDL 224, so saturated fat and dietary cholesterol are the enemies; fiber, fish, beans, oats, olive oil, nuts and lean protein are the heroes. Keep added sugar low.\nKatie: postpartum and breastfeeding; needs enough calories, protein, iron, calcium, omega-3 and fiber. Never restrictive.\nKids: whole foods, limited added sugar, plenty of fruit and vegetables.\nHousehold: fewer ultra-processed snacks, less cheese and butter, more produce.';
}
function daysSince(iso){if(!iso)return null;return Math.floor((Date.now()-new Date(iso).getTime())/864e5)}
function receiptGradeClass(g){return /^[AB]/.test(g||'')?'normal':/^C/.test(g||'')?'borderline':'high'}
function kHead(){

function cookForBar(){const who=S.cookFor||'both';const names={a:profName('a'),b:profName('b'),both:'Both'};return h`<div class="row" style="gap:8px;margin-bottom:8px"><span class="tiny muted">Cooking for</span><div class="cookfor">${['a','b','both'].map(k=>h`<button type="button" class="${who===k?'on':''}" data-act="cookfor" data-who="${k}">${esc(names[k])}</button>`).join('')}</div></div>`}
function kRecipes(){

function kInv(){

function kScans(limit){

function kRules(){return h`<div class="card"><h2>House rules<span class="sub">what scans and recipes are graded against</span></h2><textarea class="talkbox" id="houseText" style="min-height:120px;font-size:14px">${esc(houseRules())}</textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn sm ghost" data-act="ksaverules">Save rules</button></div></div>`}
function renderKitchen(){return kHead()+kRecipes()+kInv()+kScans(6)+kRules()}
function renderHome(){return kHead()+kInv()+kScans(3)+kRules()}
function renderRecipes(){return kRecipes()}
function renderGrocery(){
  const need=S.kitems.filter(it=>it.status==='low'||it.status==='out');
  const receipts=S.kscans.filter(sc=>sc.kind==='receipt');

  </div>`;
  const chart=receipts.length>=2?(()=>{const rows=receipts.slice(0,10).reverse();const W=chartW(),H=120,padL=28,padR=8,padT=10,padB=24;const slot=(W-padL-padR)/rows.length;const bw=Math.max(8,Math.min(34,slot-8));const y=v=>padT+(H-padT-padB)*(1-v/5);

      ${rows.map((sc,i)=>{const v=gradeNum(sc.grade);const x=padL+slot*i+(slot-bw)/2;const col=receiptGradeClass(sc.grade)==='normal'?'var(--good)':receiptGradeClass(sc.grade)==='borderline'?'var(--warn)':'var(--crit)';return h`<g data-tip="${esc(fmtShort(sc.date))}: ${esc(sc.grade||'?')}"><rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0)-y(v)).toFixed(1)}" rx="4" fill="${col}"/><text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(fmtShort(sc.date))}</text></g>`}).join('')}</svg></div>`})():'';
  const trips=h`<div class="card"><h2>Grocery trips<span class="sub">${receipts.length?receipts.length+' receipts scanned':'scan a receipt after each shop'}</span></h2>${chart||h`<p class="small muted" style="margin:0">After two receipts a grade trend shows here.</p>`}</div>`;
  return list+trips+kScans(10);
}
function kItem(it){
