// --- Labs ---
function labFlag(m){
  if(m.flag) return m.flag;
  const v=num(m.value);const lo=m.low==null?null:num(m.low),hi=m.high==null?null:num(m.high);
  if(hi!=null&&v>hi) return 'high';if(lo!=null&&v<lo) return 'low';if(hi!=null&&v>hi*0.92) return 'borderline';return 'normal';
}
function renderLabs(){
  if(!S.labs.length) return (isPP()?h`<div class="card"><div class="empty"><b>No bloodwork for ${esc(dispName(me()))} yet</b><p>When you get a panel, send the report screenshots to Claude in chat and every marker lands here with its range.</p></div>
    <h2 style="margin-top:6px">Worth asking for at the postpartum visit</h2>
    <ul class="nudges" style="margin-top:0">
      <li>CBC and ferritin. Iron stores after a fourth delivery and months of night feeds are the first thing to check when tiredness feels bigger than sleep debt.</li>
      <li>TSH and free T4. Postpartum thyroid swings peak between 2 and 6 months and look exactly like new-mom exhaustion or low mood.</li>
      <li>Vitamin D, and B12 if meat is rare on the plate.</li>
      <li>Fasting glucose or A1c if there was gestational diabetes, and a lipid panel once breastfeeding is done, since nursing shifts it.</li>
    </ul></div>`:h`<div class="card"><div class="empty"><b>No bloodwork yet</b><p>Send your lab report screenshots to Claude in chat. Every marker lands here with its reference range, and Coach ties your meals back to it.</p></div></div>`)+howItWorks();
  const panel=S.labs[Math.min(S.labIndex,S.labs.length-1)];const markers=Array.isArray(panel.markers)?panel.markers:[];
  const groups=[];for(const m of markers){const gname=m.group||'Other';let g=groups.find(x=>x.name===gname);if(!g){g={name:gname,items:[]};groups.push(g)}g.items.push(m)}
  const flagged=markers.filter(m=>['high','low'].includes(labFlag(m)));const border=markers.filter(m=>labFlag(m)==='borderline');
  const picker=S.labs.length>1?h`<div class="seg">${S.labs.map((l,i)=>h`<button class="${i===S.labIndex?'on':''}" data-act="lab" data-n="${i}">${esc(fmtShort(l.date))}</button>`).join('')}</div>`:'';
  return h`
  <div class="row between"><div><h2 style="font-family:var(--display);font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em">Bloodwork</h2><div class="small muted">${esc(fmtDate(panel.date,{month:'long',day:'numeric',year:'numeric'}))}${panel.lab?' · '+esc(panel.lab):''}</div></div>${picker}</div>
  <div class="card hero"><div class="stats3">
    <div class="stat"><div class="k">Out of range</div><div class="v" style="color:${flagged.length?'var(--crit)':'var(--good)'}">${flagged.length}</div></div>
    <div class="stat"><div class="k">Borderline</div><div class="v" style="color:${border.length?'var(--warn)':'var(--good)'}">${border.length}</div></div>
    <div class="stat"><div class="k">Markers</div><div class="v">${markers.length}</div></div>
  </div>${flagged.length?h`<div class="row" style="margin-top:10px">${flagged.map(m=>h`<span class="chip ${labFlag(m)==='low'?'low-lab':'high'}">${esc(m.name)} ${labFlag(m)}</span>`).join('')}</div>`:''}
  ${panel.summary?h`<div class="md small" style="margin-top:12px">${md(panel.summary)}</div>`:''}</div>
  ${groups.map(g=>h`<div class="card"><h2>${esc(g.name)}</h2><div class="labgroup">${g.items.map(markerRow).join('')}</div></div>`).join('')}`;
}
function markerRow(m){
  const f=labFlag(m);const v=num(m.value);const lo=m.low==null?null:num(m.low),hi=m.high==null?null:num(m.high);let rangeHtml='';
  if(lo!=null||hi!=null){const l=lo!=null?lo:0;const hh=hi!=null?hi:Math.max(v,l)*1.3;const span=Math.max(hh-l,1e-9);
    const dmin=Math.min(l-span*0.5,v-span*0.1,0);const dmax=Math.max(hh+span*0.5,v+span*0.1);const px=x=>Math.max(0,Math.min(100,(x-dmin)/(dmax-dmin)*100));
    rangeHtml=h`<div class="range"><span class="num">${lo!=null?lo:'<'}</span><div class="rb"><div class="ok" style="left:${px(l).toFixed(1)}%;width:${(px(hh)-px(l)).toFixed(1)}%"></div><div class="pin" style="left:${px(v).toFixed(1)}%"></div></div><span class="num">${hi!=null?hi:'>'}</span></div>`}
  return h`<div class="marker ${f}"><div class="n">${esc(m.name)} ${f!=='normal'?h`<span class="chip ${f==='low'?'low-lab':f}">${f}</span>`:''}</div><div class="v num">${esc(m.value)}<small>${esc(m.unit||'')}</small></div>${rangeHtml}${m.note?h`<div class="note">${esc(m.note)}</div>`:''}</div>`;
}

function weekSummary(){

function md(src){
  const lines=String(src).split(/\r?\n/);let out='',inList=false,para=[];
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const flush=()=>{if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[]}};
  for(const ln of lines){const l=ln.trim();
    if(/^[-*•]\s+/.test(l)){flush();if(!inList){out+='<ul>';inList=true}out+='<li>'+inline(l.replace(/^[-*•]\s+/,''))+'</li>';continue}
    if(inList){out+='</ul>';inList=false}
    if(!l){flush();continue}para.push(l)}
  flush();if(inList)out+='</ul>';return out;
}

async function downscale(file,maxPx){
  // Re-encode to JPEG so HEIC and huge photos become something Claude and the asset store accept.
  const bmp=await createImageBitmap(file).catch(()=>null);
  if(!bmp) return file;
  const sc=Math.min(1,maxPx/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',0.86));
}

async function analyze(withAnswer){
  const talk=snap.mode==='talk';
  if(!S.sample||snap.busy||(!talk&&!snap.blob))return;
  const note=(document.getElementById('snapNote')||{}).value||'';const time=(document.getElementById('snapTime')||{}).value||nowTime();
  if(talk&&!note.trim()){toast('Say or type what you ate first');return}
  if(snap.rec){try{snap.rec.stop()}catch(e){}snap.rec=null}
  const reply=withAnswer?((document.getElementById('snapReply')||{}).value||''):'';
  if(withAnswer&&!reply.trim()){toast('Type an answer first');return}
  const who=dispName(me());
  const base=mealPrompt(time,note,who,talk);
  if(withAnswer&&snap.result){snap.turns.push({role:'assistant',content:JSON.stringify(snap.result)});snap.turns.push({role:'user',content:'My answer to your question: "'+reply.replace(/"/g,'\'')+'". Re-estimate '+(talk?'':'with the same photo ')+'and reply with the same JSON shape only, with "questions" empty.'})}
  else{snap.turns=[{role:'user',content:base}]}
  snap.busy=true;snap.result=null;snap.ctl=new AbortController();renderSnap();
  try{
    const opts={modelTier:'default',cache:false,signal:snap.ctl.signal,onText:({text})=>{const el=document.querySelector('.stream');if(el)el.innerHTML='<span class="pulse"></span>'+esc(text.slice(-160))}};
    if(snap.blob)opts.images=snap.blob;
    const r=await S.sample.json(snap.turns,opts);
    if(!r||typeof r!=='object'||!Array.isArray(r.items))throw {code:'invalid_json',message:'no items'};
    snap.result=r;snap.busy=false;renderSnap();
  }catch(e){
    snap.busy=false;renderSnap();
    const code=e&&e.code||'error';
    const msg={not_granted:'You have not allowed this app to use Claude. Use the artifact menu to allow it, then try again.',rate_limited:'Claude is busy or you hit a usage limit. Try again in a bit, or save as waiting.',image_rejected:'That photo was rejected. Try a smaller or different shot.',invalid_json:'Claude answered but not in a form I could read. Try once more.',cancelled:''}[code];
    if(msg!=='')toast(msg||('Could not analyze ('+code+').'));
  }
}
async function saveSnap(){

      <div class="top"><input data-f="name" value="${esc(it.name)}" placeholder="Item" aria-label="Item name"><div class="tools"><button type="button" data-scale="0.5" title="Half">½</button><button type="button" data-scale="2" title="Double">×2</button><button type="button" class="x" data-remove="1" title="Remove item">✕</button></div></div>
      <div class="qty"><input data-f="qty" value="${esc(it.qty||'')}" placeholder="Portion (1 slice, 6 oz, 1 cup)" aria-label="Portion"></div>
      <div class="egrid">${NUTR.map(n=>h`<label>${n.l} ${n.u}<input data-f="${n.k}" type="number" step="any" inputmode="decimal" value="${num(it[n.k])}"></label>`).join('')}</div>
    </div>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="edAddItem">+ Add item</button></div>
    <div class="etotals">Total <b class="num">${r0(tot.cal)} kcal</b> · P <b>${fmtN(tot.protein,'g')}g</b> · C <b>${fmtN(tot.carbs,'g')}g</b> · F <b>${fmtN(tot.fat,'g')}g</b> · Chol <b>${fmtN(tot.chol,'mg')}mg</b> · Na <b>${fmtN(tot.sodium,'mg')}mg</b></div>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost sm" id="edCancel">Cancel</button><button class="btn" id="edSave" ${ed.busy?'disabled':''}>Save changes</button></div>
  </div></div>`;
  document.getElementById('edBg').addEventListener('click',e=>{if(e.target.id==='edBg'&&!ed.busy)root.innerHTML=''});
  document.getElementById('edCancel').addEventListener('click',()=>{root.innerHTML=''});
  document.getElementById('edSave').addEventListener('click',saveEdit);
  document.getElementById('edAddItem').addEventListener('click',()=>{readEditForm();ed.items.push(blankItem());renderEdit();const rows=document.querySelectorAll('.eitem');const last=rows[rows.length-1];last&&last.querySelector('[data-f=name]').focus()});
  const ask=document.getElementById('edAskBtn');if(ask)ask.addEventListener('click',adjustWithClaude);
  root.querySelectorAll('.eitem').forEach(row=>{
    row.querySelectorAll('[data-scale]').forEach(b=>b.addEventListener('click',()=>{readEditForm();const it=ed.items[+row.dataset.i];const f=+b.dataset.scale;for(const n of NUTR)it[n.k]=Math.round(num(it[n.k])*f*10)/10;renderEdit()}));
    const rm=row.querySelector('[data-remove]');rm.addEventListener('click',()=>{readEditForm();ed.items.splice(+row.dataset.i,1);renderEdit()});
    row.querySelectorAll('.egrid input').forEach(inp=>inp.addEventListener('input',()=>{readEditForm();const tot={};for(const n of NUTR)tot[n.k]=ed.items.reduce((a,it)=>a+num(it[n.k]),0);const el=root.querySelector('.etotals');if(el)el.innerHTML=h`Total <b class="num">${r0(tot.cal)} kcal</b> · P <b>${fmtN(tot.protein,'g')}g</b> · C <b>${fmtN(tot.carbs,'g')}g</b> · F <b>${fmtN(tot.fat,'g')}g</b> · Chol <b>${fmtN(tot.chol,'mg')}mg</b> · Na <b>${fmtN(tot.sodium,'mg')}mg</b>`}));
  });
}
async function adjustWithClaude(){
  if(!S.sample||ed.busy)return;readEditForm();
  const ask=(document.getElementById('edAsk')||{}).value||'';if(!ask.trim()){toast('Say what to change first');return}
  const prompt=personIntro()+' Here is a logged meal as JSON: '+JSON.stringify({name:ed.doc.name,time:ed.doc.time,items:ed.items})+
    '. '+dispName(me())+' says this correction: "'+ask.replace(/"/g,'\'')+'". Apply it: change, remove, add or rescale only the items the correction touches, keep everything else as it is, and recompute realistically from standard USDA-style references.'+
    ' Reply with only JSON: {"name": "", "items": [{"name": "", "qty": "", "cal": 0, "protein": 0, "carbs": 0, "fat": 0, "fiber": 0, "sugar": 0, "satfat": 0, "chol": 0, "sodium": 0}], "analysis": "'+analysisAsk()+'", "glycemic": {"gl": 0, "impact": "low|moderate|high", "note": ""}}. Units: grams for protein, carbs, fat, fiber, sugar (added sugar only), satfat; milligrams for chol and sodium; numbers only. '+profileContext();
  ed.busy=true;renderEdit();
  try{
    const r=await S.sample.json(prompt,{modelTier:'default',cache:false,onText:({text})=>{const el=document.querySelector('.stream');if(el)el.innerHTML='<span class="pulse"></span>'+esc(text.slice(-160))}});
    if(!r||!Array.isArray(r.items))throw {code:'invalid_json'};
    ed.items=r.items.map(it=>Object.assign(blankItem(),{name:String(it.name||''),qty:String(it.qty||'')},Object.fromEntries(NUTR.map(n=>[n.k,num(it[n.k])]))));
    if(r.name)ed.doc.name=String(r.name);if(r.analysis)ed.doc.analysis=String(r.analysis);if(r.glycemic&&r.glycemic.impact)ed.doc.glycemic={gl:num(r.glycemic.gl),impact:String(r.glycemic.impact),note:String(r.glycemic.note||'')};
    ed.doc.notes=((ed.doc.notes?ed.doc.notes+' ':'')+'Corrected: '+ask.trim()).slice(0,300);
    ed.busy=false;renderEdit();toast('Adjusted. Check it, then save.');
  }catch(e){ed.busy=false;renderEdit();const code=e&&e.code||'error';toast(code==='not_granted'?'Allow this app to use Claude from the artifact menu, then try again.':code==='rate_limited'?'Claude is busy. Edit the numbers by hand or try again shortly.':'Could not adjust ('+code+'). Edit by hand instead.')}
}
async function saveEdit(){
  if(ed.busy)return;readEditForm();
  const btn=document.getElementById('edSave');btn.disabled=true;btn.textContent='Saving…';
  const doc=Object.assign({},ed.doc,{items:ed.items.filter(it=>it.name.trim()||num(it.cal)>0),updatedAt:new Date().toISOString()});
  if(!doc.name)doc.name='Meal';if(doc.items.length)doc.pending=false;
  try{await store.set('meals',ed.id,doc);document.getElementById('sheetRoot').innerHTML='';toast('Saved');render()}
  catch(e){btn.disabled=false;btn.textContent='Save changes';toast('Could not save ('+(e&&e.code||'error')+')')}
}

    root.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{pic.kind=b.dataset.pick;const inp=document.getElementById('picInput');inp.value='';inp.click()}));root.querySelectorAll('[data-rmpic]').forEach(b=>b.addEventListener('click',()=>savePhoto(b.dataset.rmpic,null)));
    document.getElementById('hForm').addEventListener('submit',async e=>{e.preventDefault();const doc=Object.assign({},S.settings||{},{name:document.getElementById('h_name').value.trim()||'The Holguin kitchen',updatedAt:new Date().toISOString()});delete doc.id;try{await store.set('settings','profile',doc);S.settings=Object.assign({id:'profile'},doc);root.innerHTML='';toast('Saved');render()}catch(err){toast('Could not save')}});
    return}
  root.innerHTML=h`<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-label="Settings"><div class="grab"></div>
    <h2>${esc(profName(S.profile))}'s settings</h2>
    <form id="tgForm">
    <div class="ppform">
      <label class="full">Name on the toggle<input type="text" name="name" id="tg_name" value="${esc((S.settings&&S.settings.name)||PROFILES[S.profile].name)}" maxlength="14"></label>
      ${isPP()?h`
      <label>Baby born<input type="date" name="born" id="st_born" value="${esc(q.born)}"></label>
      <label>Delivery<select name="delivery" id="st_delivery"><option value="vaginal" ${q.delivery==='vaginal'?'selected':''}>Vaginal</option><option value="csection" ${q.delivery==='csection'?'selected':''}>C-section</option></select></label>
      <label class="chk full"><input type="checkbox" name="bf" id="st_bf" ${q.breastfeeding?'checked':''}>Breastfeeding (adds about 400 kcal and 3 cups of water to the targets)</label>
      <label class="chk full"><input type="checkbox" name="cleared" id="st_cleared" ${q.cleared?'checked':''}>Cleared for exercise by my provider (unlocks core and yoga)</label>`:''}
    </div>
    <h2 style="font-size:16px">Daily targets</h2>

    <p class="small muted" style="margin:0 0 10px">${esc(STD_BLURB[S.profile][standard()])}</p>
    <p class="small muted" style="margin:0 0 12px">${isPP()?'Protein, fiber and calories are floors right now: recovery and milk come first. Sugar, saturated fat and sodium are ceilings.':'Protein and fiber are floors to reach. Calories, carbs and fat are budgets. Sugar, saturated fat, cholesterol and sodium are ceilings. Claude tunes these from bloodwork.'}</p>
    <div class="targets">${NUTR.map(n=>h`<label>${n.l} (${n.u})<input type="number" step="any" min="0" name="${n.k}" id="tg_${n.k}" value="${tg[n.k]}"></label>`).join('')}</div>
    <div class="row between" style="margin-top:14px"><span class="row" style="gap:8px"><button type="button" class="linkbtn" id="tgReset">Reset targets to defaults</button><span class="tiny muted">${S.mode==='db'?'Saved to this log only.':'Saved in this browser only.'}</span></span><span class="row"><button type="button" class="btn ghost sm" id="tgCancel">Cancel</button><button class="btn sm" type="submit">Save</button></span></div></form>
    <div class="looks"><div class="eyebrow">Look</div><div class="swatches">${Object.keys(THEMES[S.profile]).map(t=>h`<button type="button" class="swatch ${S.theme===t?'on':''}" data-theme="${t}"><i style="background:${SWATCH[t]}"></i>${THEMES[S.profile][t]}</button>`).join('')}</div></div>
    <div class="looks"><div class="eyebrow">Background feel</div><div class="swatches bgs">${Object.keys(BGS[S.profile]).map(b=>h`<button type="button" class="swatch ${S.bg===b?'on':''}" data-bg="${b}"><i style="background:${BGSWATCH[b]}"></i>${BGS[S.profile][b]}</button>`).join('')}</div></div>
    <div class="photos"><div class="eyebrow">Photos</div>
      <div class="prow"><div class="pthumb" style="${coverUrl()?'background-image:url(\''+esc(coverUrl())+'\')':''}"></div><div class="pinfo"><b>Cover photo</b><span class="tiny muted">Sits behind the Today card. The kids, the family, a trip.</span><div class="row"><button type="button" class="btn ghost sm" data-pick="cover">${coverUrl()?'Change':'Choose'}</button>${coverUrl()?'<button type="button" class="linkbtn danger" data-rmpic="cover">Remove</button>':''}</div></div></div>

const pic={kind:'cover'};
document.getElementById('picInput').addEventListener('change',async()=>{const inp=document.getElementById('picInput');const f=inp.files&&inp.files[0];if(!f)return;
  toast('Preparing photo…');
  const blob=pic.kind==='avatar'?await squareCrop(f,192):await downscale(f,1400);
  await savePhoto(pic.kind,blob);
});
async function squareCrop(file,size){
  const bmp=await createImageBitmap(file).catch(()=>null);if(!bmp)return file;
  const s=Math.min(bmp.width,bmp.height);const c=document.createElement('canvas');c.width=size;c.height=size;
  c.getContext('2d').drawImage(bmp,(bmp.width-s)/2,(bmp.height-s)/2,s,s,0,0,size,size);
  return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',0.88));
}
async function savePhoto(kind,blob){
  const idKey=kind+'Id',dataKey=kind+'Data';const doc=Object.assign({},S.settings||{});delete doc.id;const oldId=doc[idKey];
  try{
    if(blob){
      if(S.mode==='db'){if(!S.assets){toast('Photos need Editor or Contributor access.');return}const up=await S.assets.upload(blob);doc[idKey]=up.id;delete doc[dataKey]}
      else{doc[dataKey]=await blobToDataUrl(blob,kind==='avatar'?192:900);delete doc[idKey]}
    }else{delete doc[idKey];delete doc[dataKey]}
    if(!doc.name)doc.name=PROFILES[S.profile].name;doc.updatedAt=new Date().toISOString();
    await store.set('settings','profile',doc);
    if(oldId&&oldId!==doc[idKey]&&S.assets){S.assets.delete(oldId).catch(()=>{})}
    S.settings=Object.assign({id:'profile'},doc);profileNames();render();openSettings();
    toast(blob?(kind==='avatar'?'Toggle photo set':'Cover photo set'):'Photo removed');
  }catch(e){toast('Could not save photo ('+(e&&e.code||'error')+')')}
}

function scoreTail(){const es=dayEntries(todayStr());if(!es.length)return'';const sc=dayScore(dayTotals(todayStr()),targets());return '. Day score '+sc.score+', '+sc.grade.toLowerCase()+'.'}
let toastT=null;
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML=h`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>{r.innerHTML=''},3200)}

boot();
})();
