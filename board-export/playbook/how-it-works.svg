<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3c5d"/></marker>
  <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a3a"/></marker>
  <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"/></marker>
  <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fa0"/></marker>
  <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7560d"/></marker>
  <marker id="aGr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a95a3"/></marker>
</defs>

<!-- SOURCES band -->
<rect x="20" y="20" width="720" height="92" rx="12" fill="#f6f8fa" stroke="#d9e1e8"/>
<text x="40" y="44" font-size="11" font-weight="700" fill="#5b6775" letter-spacing="1.5">WHAT FEEDS IT</text>
<g font-size="12" fill="#1c2430">
  <rect x="40" y="56" width="150" height="40" rx="8" fill="#fff" stroke="#d9e1e8"/><text x="115" y="74" text-anchor="middle" font-weight="700">Email</text><text x="115" y="89" text-anchor="middle" font-size="10" fill="#5b6775">Gmail, both sides</text>
  <rect x="210" y="56" width="150" height="40" rx="8" fill="#fff" stroke="#d9e1e8"/><text x="285" y="74" text-anchor="middle" font-weight="700">Texts and calls</text><text x="285" y="89" text-anchor="middle" font-size="10" fill="#5b6775">iMessage, group chats</text>
  <rect x="380" y="56" width="150" height="40" rx="8" fill="#fff" stroke="#d9e1e8"/><text x="455" y="74" text-anchor="middle" font-weight="700">Calendar</text><text x="455" y="89" text-anchor="middle" font-size="10" fill="#5b6775">deadlines, meetings</text>
  <rect x="550" y="56" width="170" height="40" rx="8" fill="#fff" stroke="#d9e1e8"/><text x="635" y="74" text-anchor="middle" font-weight="700">Lawyers and vendors</text><text x="635" y="89" text-anchor="middle" font-size="10" fill="#5b6775">Steve, Dana, Prakash, Pie</text>
</g>

<!-- arrows from sources down to the two Claudes -->
<path d="M190,112 C190,150 141,165 141,205" fill="none" stroke="#8a95a3" stroke-width="2" marker-end="url(#aGr)"/>
<path d="M570,112 C570,150 619,165 619,205" fill="none" stroke="#8a95a3" stroke-width="2" marker-end="url(#aGr)"/>
<text x="120" y="165" font-size="10" fill="#5b6775">read only</text>
<text x="600" y="165" font-size="10" fill="#5b6775">read only</text>

<!-- ADRIAN column -->
<rect x="30" y="205" width="222" height="150" rx="12" fill="#eef4f8" stroke="#0b3c5d" stroke-width="2"/>
<text x="141" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#0b3c5d">Adrian's Claude</text>
<text x="141" y="250" text-anchor="middle" font-size="10.5" fill="#5b6775">Nightly sweep, 6:45 PM Pacific</text>
<g font-size="11" fill="#1c2430">
  <text x="48" y="276">1. Reads what arrived since the last sweep</text>
  <text x="48" y="294">2. Crosses off what finished, with evidence</text>
  <text x="48" y="312">3. Updates what moved, adds what is new</text>
  <text x="48" y="330">4. Files the documents exchanged</text>
  <text x="48" y="347" fill="#5b6775">Never deletes. Never sends.</text>
</g>

<rect x="30" y="560" width="222" height="96" rx="12" fill="#fff" stroke="#0b3c5d" stroke-width="2"/>
<circle cx="66" cy="590" r="16" fill="#0b3c5d"/><text x="66" y="595" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">A</text>
<text x="92" y="586" font-size="14" font-weight="700" fill="#0b3c5d">Adrian</text>
<text x="92" y="602" font-size="10.5" fill="#5b6775">Owner of the board</text>
<text x="48" y="628" font-size="11" fill="#1c2430">Gets two short notes every evening</text>
<text x="48" y="644" font-size="11" fill="#1c2430">Makes the calls only he can make</text>

<!-- KEVIN column -->
<rect x="508" y="205" width="222" height="150" rx="12" fill="#edf7f0" stroke="#1f7a3a" stroke-width="2"/>
<text x="619" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#1f7a3a">Kevin's Claude</text>
<text x="619" y="250" text-anchor="middle" font-size="10.5" fill="#5b6775">Three prompts at 6:45 PM, fenced by the rules</text>
<g font-size="11" fill="#1c2430">
  <rect x="522" y="262" width="52" height="16" rx="4" fill="#0e7c86"/><text x="548" y="274" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">DAILY</text><text x="582" y="274">Sync: cross off, update, add</text>
  <rect x="522" y="286" width="52" height="16" rx="4" fill="#1f7a3a"/><text x="548" y="298" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">DAILY</text><text x="582" y="298">Pickup: run his item prompts</text>
  <rect x="522" y="310" width="52" height="16" rx="4" fill="#5b3fa0"/><text x="548" y="322" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">DAILY</text><text x="582" y="322">Note to Adrian, same run</text>
  <text x="522" y="347" fill="#5b6775">Drafts only. Kevin says GO or SEND.</text>
</g>

<rect x="508" y="560" width="222" height="96" rx="12" fill="#fff" stroke="#1f7a3a" stroke-width="2"/>
<circle cx="544" cy="590" r="16" fill="#1f7a3a"/><text x="544" y="595" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">K</text>
<text x="570" y="586" font-size="14" font-weight="700" fill="#1f7a3a">Kevin</text>
<text x="570" y="602" font-size="10.5" fill="#5b6775">Editor, signed in as kmdgroupla@</text>
<text x="526" y="628" font-size="11" fill="#1c2430">Approves each draft, sends, signs, pays</text>
<text x="526" y="644" font-size="11" fill="#1c2430">Marks his items Done with evidence</text>

<!-- HUB: the board -->
<rect x="290" y="230" width="180" height="420" rx="16" fill="#0b3c5d"/>
<rect x="290" y="230" width="180" height="46" rx="16" fill="#082c45"/>
<rect x="290" y="260" width="180" height="16" fill="#082c45"/>
<text x="380" y="259" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">THE BOARD</text>
<text x="380" y="296" text-anchor="middle" font-size="10.5" fill="#bcd0e0">Adrian &amp; Kevin's Action Dashboard</text>
<text x="380" y="311" text-anchor="middle" font-size="10" fill="#bcd0e0">the single source of truth</text>
<g font-size="11.5" fill="#fff">
  <rect x="306" y="328" width="148" height="50" rx="8" fill="#154c70"/><text x="380" y="348" text-anchor="middle" font-weight="700">Items by company</text><text x="380" y="365" text-anchor="middle" font-size="10" fill="#bcd0e0">VBX · KMD · Wyoming · Personal</text>
  <rect x="306" y="386" width="148" height="50" rx="8" fill="#154c70"/><text x="380" y="406" text-anchor="middle" font-weight="700">Owner, status, due</text><text x="380" y="423" text-anchor="middle" font-size="10" fill="#bcd0e0">priority and calendar view</text>
  <rect x="306" y="444" width="148" height="50" rx="8" fill="#154c70"/><text x="380" y="464" text-anchor="middle" font-weight="700">Thread per item</text><text x="380" y="481" text-anchor="middle" font-size="10" fill="#bcd0e0">updates, evidence, files</text>
  <rect x="306" y="502" width="148" height="50" rx="8" fill="#154c70"/><text x="380" y="522" text-anchor="middle" font-weight="700">A prompt per item</text><text x="380" y="539" text-anchor="middle" font-size="10" fill="#bcd0e0">copy, paste, move it forward</text>
  <rect x="306" y="560" width="148" height="50" rx="8" fill="#154c70"/><text x="380" y="580" text-anchor="middle" font-weight="700">File cabinet</text><text x="380" y="597" text-anchor="middle" font-size="10" fill="#bcd0e0">everything exchanged</text>
</g>
<text x="380" y="636" text-anchor="middle" font-size="10" fill="#bcd0e0">Only Adrian and Kevin can write here</text>

<!-- Adrian's Claude <-> board -->
<path d="M254,280 L288,280" fill="none" stroke="#0b3c5d" stroke-width="2.5" marker-end="url(#aN)" marker-start="url(#aN)"/>
<text x="271" y="268" text-anchor="middle" font-size="9" fill="#0b3c5d" font-weight="700">reads</text>
<text x="271" y="297" text-anchor="middle" font-size="9" fill="#0b3c5d" font-weight="700">writes</text>

<!-- Kevin's Claude <-> board -->
<path d="M472,280 L506,280" fill="none" stroke="#1f7a3a" stroke-width="2.5" marker-end="url(#aG)" marker-start="url(#aG)"/>
<text x="489" y="268" text-anchor="middle" font-size="9" fill="#1f7a3a" font-weight="700">reads</text>
<text x="489" y="297" text-anchor="middle" font-size="9" fill="#1f7a3a" font-weight="700">writes</text>

<!-- Adrian's Claude -> Adrian (summary) -->
<path d="M141,355 L141,560" fill="none" stroke="#0b3c5d" stroke-width="2" marker-end="url(#aN)"/>
<rect x="51" y="440" width="180" height="46" rx="8" fill="#fff" stroke="#0b3c5d"/>
<text x="141" y="459" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b3c5d">Nightly summary</text>
<text x="141" y="475" text-anchor="middle" font-size="10" fill="#1c2430">added, updated, filed, decisions</text>

<!-- Kevin's Claude -> Kevin (drafts) and Kevin -> Claude (GO) -->
<path d="M609,355 L609,560" fill="none" stroke="#1f7a3a" stroke-width="2" marker-end="url(#aG)"/>
<path d="M629,560 L629,355" fill="none" stroke="#1f7a3a" stroke-width="2" marker-end="url(#aG)"/>
<rect x="529" y="440" width="180" height="46" rx="8" fill="#fff" stroke="#1f7a3a"/>
<text x="619" y="459" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f7a3a">Drafts up, GO / SEND down</text>
<text x="619" y="475" text-anchor="middle" font-size="10" fill="#1c2430">nothing leaves without his yes</text>

<!-- Adrian <-> board and Kevin <-> board (people editing directly) -->
<path d="M254,608 L306,608" fill="none" stroke="#8a95a3" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aGr)" marker-start="url(#aGr)"/>
<path d="M454,608 L506,608" fill="none" stroke="#8a95a3" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aGr)" marker-start="url(#aGr)"/>

<!-- Weekly note: Kevin's Claude -> Adrian, across the bottom -->
<path d="M580,656 C580,700 180,700 180,656" fill="none" stroke="#5b3fa0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aP)"/>
<rect x="290" y="672" width="180" height="26" rx="13" fill="#f2eefa" stroke="#5b3fa0"/>
<text x="380" y="689" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b3fa0">Daily note to Adrian, 6:45 PM</text>

<!-- OUTPUTS band -->
<rect x="20" y="730" width="720" height="130" rx="12" fill="#fdf3ea" stroke="#b7560d"/>
<text x="40" y="754" font-size="11" font-weight="700" fill="#b7560d" letter-spacing="1.5">WHAT COMES OUT</text>
<g font-size="11" fill="#1c2430">
  <rect x="40" y="766" width="130" height="80" rx="8" fill="#fff" stroke="#e8c9a8"/><text x="105" y="788" text-anchor="middle" font-weight="700">Items closed</text><text x="105" y="806" text-anchor="middle" font-size="10" fill="#5b6775">with the proof</text><text x="105" y="821" text-anchor="middle" font-size="10" fill="#5b6775">in the thread</text>
  <rect x="180" y="766" width="130" height="80" rx="8" fill="#fff" stroke="#e8c9a8"/><text x="245" y="788" text-anchor="middle" font-weight="700">Drafts ready</text><text x="245" y="806" text-anchor="middle" font-size="10" fill="#5b6775">emails, forms, lists</text><text x="245" y="821" text-anchor="middle" font-size="10" fill="#5b6775">Kevin sends them</text>
  <rect x="320" y="766" width="130" height="80" rx="8" fill="#fff" stroke="#e8c9a8"/><text x="385" y="788" text-anchor="middle" font-weight="700">Decisions queued</text><text x="385" y="806" text-anchor="middle" font-size="10" fill="#5b6775">the few things only</text><text x="385" y="821" text-anchor="middle" font-size="10" fill="#5b6775">Adrian or Kevin decide</text>
  <rect x="460" y="766" width="130" height="80" rx="8" fill="#fff" stroke="#e8c9a8"/><text x="525" y="788" text-anchor="middle" font-weight="700">One file cabinet</text><text x="525" y="806" text-anchor="middle" font-size="10" fill="#5b6775">every document</text><text x="525" y="821" text-anchor="middle" font-size="10" fill="#5b6775">exchanged, dated</text>
  <rect x="600" y="766" width="120" height="80" rx="8" fill="#fff" stroke="#e8c9a8"/><text x="660" y="788" text-anchor="middle" font-weight="700">One truth</text><text x="660" y="806" text-anchor="middle" font-size="10" fill="#5b6775">both sides see</text><text x="660" y="821" text-anchor="middle" font-size="10" fill="#5b6775">the same board</text>
</g>
</svg>