<title>Macro Polo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first, one column, deliberately dark. Day navigation up top, big calorie figure and eating-window
   timeline as the hero, ceilings and spikes next, then the chronological log. A raised camera button sits in the
   middle of the bottom bar: photographing food is the main action. Single committed theme. */
:root{
  color-scheme:dark;
  --bg:#0B1016; --bg-glow:rgba(46,196,166,.14); --surface:#141B22; --surface-2:#1C252E; --surface-3:#243039; --line:#263240; --line-2:#31404F;
  --fg:#EEF3F7; --muted:#9BAAB8; --faint:#66768A;
  --accent:#2EC4A6; --accent-ink:#06120F; --accent-soft:rgba(46,196,166,.16); --accent-glow:0 0 0 6px rgba(46,196,166,.18),0 10px 30px rgba(46,196,166,.35);
  --good:#5FD39A; --warn:#F2B84B; --crit:#F0706A;
  --good-soft:rgba(95,211,154,.16); --warn-soft:rgba(242,184,75,.16); --crit-soft:rgba(240,112,106,.16);
  --protein:#3987e5; --carbs:#d95926; --fat:#9085e9; --fiber:#c98500;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Instrument Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  --radius:18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 420px at 50% -120px,var(--bg-glow),transparent 70%);background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:flex;flex-direction:column;min-height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(var(--bg),rgba(11,16,22,.85));backdrop-filter:blur(10px);
  padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.02em}
.brand h1 span{color:var(--accent)}
.brand .tag{font-size:12px;color:var(--muted);white-space:nowrap}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on .dot{background:var(--good);box-shadow:0 0 8px var(--good)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);flex:none}
.iconbtn svg{width:18px;height:18px}

main{flex:1;padding-block:8px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;width:100%;margin:0 auto}
.view{display:flex;flex-direction:column;gap:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(20,27,34,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.active{color:var(--accent)}
nav.tabs .snapwrap{display:flex;justify-content:center;align-items:flex-end;padding-bottom:6px}
.snap{width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;margin-top:-26px;box-shadow:var(--accent-glow);display:flex;align-items:center;justify-content:center;transition:transform .15s ease}
.snap:active{transform:scale(.94)}
.snap svg{width:28px;height:28px}
.snap[disabled]{opacity:.5}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.hero{background:linear-gradient(160deg,#182229,#121920);border-color:var(--line-2)}
.card h2{font-family:var(--display);font-size:16px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-family:var(--body);font-weight:400;color:var(--muted);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .d{font-family:var(--display);font-weight:700;font-size:18px;text-align:center;flex:1;letter-spacing:-.01em}
.datebar .d small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}

.hero-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media (max-width:380px){.hero-top{grid-template-columns:1fr;justify-items:center}}
.ring{width:146px;height:146px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--surface-3);stroke-width:11}
.ring .arc{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;transition:stroke-dasharray .5s ease;filter:drop-shadow(0 0 6px rgba(46,196,166,.5))}
.ring .arc.over{stroke:var(--crit);filter:drop-shadow(0 0 6px rgba(240,112,106,.5))}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .center b{font-family:var(--display);font-size:32px;font-weight:800;line-height:1;letter-spacing:-.03em}
.ring .center span{font-size:11px;color:var(--muted);margin-top:5px;max-width:90px;line-height:1.2}
.macros{display:flex;flex-direction:column;gap:10px;width:100%;min-width:0}
.macro .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;align-items:baseline}
.macro .lbl b{font-weight:600;display:flex;align-items:center;gap:6px}
.macro .lbl b i{width:8px;height:8px;border-radius:50%;display:inline-block}
.macro .lbl .num{font-size:12px;color:var(--muted)}
.macro .lbl .num b{font-family:var(--display);font-size:14px;color:var(--fg);display:inline}
.bar{height:7px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .4s ease}

.windows{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.win{background:var(--surface-2);border-radius:12px;padding:10px 11px;min-width:0}
.win .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.win .v{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.win .v small{font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted);display:block;letter-spacing:0}
.win.live .v{color:var(--accent)}

.limits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.limits{grid-template-columns:repeat(2,1fr)}}
.limit{background:var(--surface-2);border-radius:12px;padding:10px 11px;min-width:0}
.limit .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.limit .v{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.2;margin-top:2px;letter-spacing:-.02em}
.limit .v small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:11px;letter-spacing:0}
.limit .bar{margin-top:7px}
.limit.good .bar>i{background:var(--good)} .limit.warn .bar>i{background:var(--warn)} .limit.crit .bar>i{background:var(--crit)}
.limit.crit .v{color:var(--crit)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.chip.low,.chip.normal{background:var(--good-soft);color:var(--good)}
.chip.moderate,.chip.borderline{background:var(--warn-soft);color:var(--warn)}
.chip.high,.chip.low-lab{background:var(--crit-soft);color:var(--crit)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

.entries{display:flex;flex-direction:column;gap:10px}
.entry{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:10px 12px;background:var(--surface-2)}
.entry.pending{border-style:dashed}
.entry .thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-3)}
.entry .nothumb{width:64px;height:64px;border-radius:10px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.entry .nothumb svg{width:24px;height:24px}
.entry .body{min-width:0;display:flex;flex-direction:column;gap:5px}
.entry .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.entry .name{font-weight:600;min-width:0;line-height:1.3}
.entry .time{font-family:var(--mono);font-size:12px;color:var(--accent);display:block;margin-bottom:2px}
.entry .cal{font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap;letter-spacing:-.02em;line-height:1}
.entry .cal small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:11px;letter-spacing:0}
.entry .macroline{display:flex;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.entry .macroline b{color:var(--fg);font-weight:500}
.entry .more{grid-column:1/-1}
.entry details summary{cursor:pointer;font-size:12px;color:var(--accent);font-weight:500;list-style:none}
.entry details summary::-webkit-details-marker{display:none}
.entry .items{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.entry .items li{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line-2);padding-top:4px}
.entry .analysis{margin-top:8px;font-size:13px;background:var(--surface);border-radius:10px;padding:9px 11px;border-left:3px solid var(--accent)}
.entry .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.linkbtn{background:none;border:none;color:var(--muted);font-size:12px;padding:4px 0;text-decoration:underline;text-underline-offset:2px}
.linkbtn.danger{color:var(--crit)}
.confirm{display:flex;gap:6px;align-items:center;font-size:12px}

.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:11px 18px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-2)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}

.empty{text-align:center;padding:22px 12px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--fg);font-family:var(--display);font-weight:700;font-size:16px}
.empty p{margin:0;max-width:40ch}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14px}
.steps li::marker{color:var(--accent);font-weight:700;font-family:var(--display)}

form.add{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
form.add .full{grid-column:1/-1}
form.add label,.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
form.add input,form.add select,form.add textarea,.field input,.field textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--fg);width:100%;min-width:0}
form.add .nutr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-column:1/-1}
form.add .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.notice{font-size:13px;padding:9px 11px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.notice.err{background:var(--crit-soft);color:var(--crit)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{background:transparent;border:none;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

.chart{width:100%;overflow:visible;display:block}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .target{stroke:var(--fg);stroke-width:1.5;stroke-dasharray:4 4;opacity:.6}
.chart .axis{stroke:var(--line-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tooltip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
.chartwrap{position:relative}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n{text-align:right}
table.t tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 11px;min-width:0}
.stat .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.stat .v{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.15;margin-top:3px}
.stat .v small{font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted);display:block;letter-spacing:0}

.labgroup{display:flex;flex-direction:column}
.marker{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.marker:first-child{border-top:none;padding-top:0}
.marker .n{font-weight:500}
.marker .v{font-family:var(--display);font-weight:800;font-size:17px;text-align:right;white-space:nowrap;letter-spacing:-.01em}
.marker .v small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:11px;margin-left:3px;letter-spacing:0}
.marker .range{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.marker .range .rb{flex:1;height:6px;border-radius:3px;position:relative;background:var(--surface-3)}
.marker .range .rb .ok{position:absolute;top:0;bottom:0;background:var(--good-soft);border-radius:3px}
.marker .range .rb .pin{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);transform:translateX(-50%);background:var(--good)}
.marker.high .pin,.marker.low .pin{background:var(--crit)}
.marker.borderline .pin{background:var(--warn)}
.marker .note{grid-column:1/-1;font-size:12px;color:var(--muted)}

.insight{display:flex;flex-direction:column;gap:6px}
.insight .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.insight h3{font-family:var(--display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.md p{margin:0 0 8px}
.md p:last-child{margin-bottom:0}
.md ul{margin:0 0 8px;padding-left:18px}
.md li{margin:3px 0}
.md strong{font-weight:600;color:var(--fg)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-top:1px solid var(--line-2);
  padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 12px}
.sheet h2{font-family:var(--display);font-size:19px;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.targets label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
.targets input{background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:8px;font-size:14px;width:100%;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:999px;font-size:13px;z-index:30;font-weight:500;max-width:90vw;text-align:center}

/* snap sheet */
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:14px;background:var(--surface-2);display:block}
.snapgrid{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px;align-items:end}
.stream{color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:12px;white-space:pre-wrap;max-height:120px;overflow:auto;font-family:var(--mono);font-size:11.5px}
.result{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.result .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.result .head input{font-family:var(--display);font-weight:700;font-size:17px;background:transparent;border:none;border-bottom:1px dashed var(--line-2);padding:2px 0;width:100%;min-width:0;letter-spacing:-.01em}
.result .items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13px}
.result .items li{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:5px}
.result .items li:first-child{border-top:none;padding-top:0}
.questions{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.questions b{color:var(--warn)}
.questions ul{margin:4px 0 8px;padding-left:18px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite ease-in-out;margin-right:6px}

/* edit sheet */
.edithead{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.askrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px;align-items:end}
.askrow .btn{white-space:nowrap}
.eitems{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.eitem{background:var(--surface-2);border-radius:12px;padding:10px 11px;display:flex;flex-direction:column;gap:8px}
.eitem .top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.eitem .top input{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font-size:14px;width:100%;min-width:0;font-weight:600}
.eitem .qty input{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:13px;width:100%;min-width:0}
.eitem .tools{display:flex;gap:6px;align-items:center}
.eitem .tools button{background:var(--surface-3);border:none;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600;color:var(--fg)}
.eitem .tools button.x{color:var(--crit)}
.egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.egrid label{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.egrid input{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;font-size:13px;width:100%;min-width:0;font-family:var(--mono);text-transform:none;letter-spacing:0}

</style>

<div id="toastRoot"></div>

<script>
(function(){
'use strict';
// ---------- constants ----------
const NUTR = [
  {k:'cal',l:'Calories',u:'kcal',kind:'goal'},
  {k:'protein',l:'Protein',u:'g',kind:'floor',color:'var(--protein)'},
  {k:'carbs',l:'Carbs',u:'g',kind:'budget',color:'var(--carbs)'},
  {k:'fat',l:'Fat',u:'g',kind:'budget',color:'var(--fat)'},
  {k:'fiber',l:'Fiber',u:'g',kind:'floor',color:'var(--fiber)'},
  {k:'sugar',l:'Added sugar',u:'g',kind:'ceiling'},
  {k:'satfat',l:'Sat. fat',u:'g',kind:'ceiling'},
  {k:'chol',l:'Cholesterol',u:'mg',kind:'ceiling'},
  {k:'sodium',l:'Sodium',u:'mg',kind:'ceiling'},
];
const DEFAULT_TARGETS = {cal:2000,protein:150,carbs:200,fat:65,fiber:30,sugar:36,satfat:20,chol:300,sodium:2300};
const LS_PREFIX = 'macropolo:';

// ---------- state ----------
const S = {
  view:'today', date: todayStr(), range:7,
  settings:null, meals:[], labs:[], insights:[],
  loaded:{meals:false,labs:false,insights:false,settings:false},
  mode:'local', db:null, root:null, uid:null, sample:null, assets:null, canImages:false, imageTypes:'image/*',
  labIndex:0, addOpen:false, confirmId:null,
};

// ---------- helpers ----------
function pad(n){return String(n).padStart(2,'0')}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nowTime(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function shiftDate(s,n){const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d+n);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate())}
function fmtDate(s,opts){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,opts||{weekday:'long',month:'long',day:'numeric'})}
function fmtShort(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function fmtTime(t){if(!t)return'';const [hh,mm]=t.split(':').map(Number);const d=new Date(2000,0,1,hh,mm);return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}).replace(' ',' ')}
function mins(t){if(!t)return null;const [hh,mm]=t.split(':').map(Number);return hh*60+(mm||0)}
function minsToTime(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function fmtDur(m){if(m==null||!isFinite(m))return '–';m=Math.round(m);const hh=Math.floor(m/60),mm=m%60;return hh?(hh+'h'+(mm?' '+pad(mm)+'m':'')):mm+'m'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){return typeof v==='number'&&isFinite(v)?v:(v===''||v==null?0:(isFinite(+v)?+v:0))}
function r0(v){return Math.round(v)}
function r1(v){return Math.round(v*10)/10}
function fmtN(v,u){v=num(v);const s=(u==='g'&&v<10&&v!==Math.round(v))?r1(v):r0(v);return s.toLocaleString()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function slug(s){return String(s||'meal').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'meal'}
function h(strings,...vals){return strings.reduce((a,s,i)=>a+s+(i<vals.length?vals[i]:''),'')}
function targets(){return Object.assign({},DEFAULT_TARGETS,(S.settings&&S.settings.targets)||{})}

function entryTotals(e){
  const t={};
  if(Array.isArray(e.items)&&e.items.length){for(const n of NUTR)t[n.k]=e.items.reduce((a,it)=>a+num(it[n.k]),0)}
  else{const src=e.totals||e;for(const n of NUTR)t[n.k]=num(src[n.k])}
  return t;
}
function dayEntries(date){return S.meals.filter(m=>m.date===date).sort((a,b)=>((mins(a.time)??1e9)-(mins(b.time)??1e9))||String(a.createdAt||'').localeCompare(String(b.createdAt||'')))}
function dayTotals(date){const t={};for(const n of NUTR)t[n.k]=0;for(const e of dayEntries(date)){const et=entryTotals(e);for(const n of NUTR)t[n.k]+=et[n.k]}return t}

// Eating window and fasts, from entry times.
function dayWindow(date){
  const ts=dayEntries(date).map(e=>mins(e.time)).filter(v=>v!=null);
  if(!ts.length) return null;
  const first=Math.min(...ts),last=Math.max(...ts);
  const prev=dayEntries(shiftDate(date,-1)).map(e=>mins(e.time)).filter(v=>v!=null);
  const overnight=prev.length?(24*60-Math.max(...prev))+first:null;
  return {first,last,len:last-first,overnight,count:ts.length};
}
function fastingNow(){
  const now=new Date();const nowM=now.getHours()*60+now.getMinutes();
  const t=dayEntries(todayStr()).map(e=>mins(e.time)).filter(v=>v!=null&&v<=nowM);
  if(t.length) return nowM-Math.max(...t);
  const y=dayEntries(shiftDate(todayStr(),-1)).map(e=>mins(e.time)).filter(v=>v!=null);
  if(y.length) return 24*60-Math.max(...y)+nowM;
  return null;
}

// Blood-sugar impact estimate: net carbs x estimated glycemic index, dampened by fiber, protein and fat.
function glycemic(e){
  if(e.glycemic&&e.glycemic.impact) return {gl:num(e.glycemic.gl),impact:e.glycemic.impact,note:e.glycemic.note||'',est:false};
  const t=entryTotals(e);const net=Math.max(0,t.carbs-t.fiber);
  if(net<3) return {gl:0,impact:'low',note:'',est:true};
  let gi=50+35*Math.min(1,t.sugar/Math.max(t.carbs,1))-2.5*t.fiber-0.25*t.protein-0.2*t.fat;gi=Math.max(20,Math.min(90,gi));
  const gl=Math.round(net*gi/100);return {gl,impact:gl<10?'low':gl<20?'moderate':'high',note:'',est:true};
}
const IMPACT_LABEL={low:'Low spike',moderate:'Moderate spike',high:'High spike'};
function ratioClass(v,limit){const r=limit?v/limit:0;return r<0.8?'good':r<1?'warn':'crit'}
function photoUrl(e){return e.photoId?'/_blob/'+encodeURIComponent(e.photoId):(e.photoData||'')}

// ---------- storage adapter ----------
const listeners={};
function lsGet(coll){try{return JSON.parse(localStorage.getItem(LS_PREFIX+coll)||'[]')}catch(e){return []}}
function lsSet(coll,arr){try{localStorage.setItem(LS_PREFIX+coll,JSON.stringify(arr))}catch(e){}}
function lsEmit(coll){(listeners[coll]||[]).forEach(fn=>fn(lsGet(coll)))}
// Each signed-in person gets their own private subtree (data/users/<id>/root/...), invisible to
// everyone else on the artifact, the owner included. Without a user id, shared top-level collections.
function collRef(coll){return S.root?S.root.collection(coll):S.db.collection(coll)}
const store={
  subscribe(coll,cb,onErr){
    if(S.db){return collRef(coll).limit(1000).onSnapshot(snap=>cb(snap.docs.map(d=>Object.assign({id:d.id},d.data()))),err=>{onErr&&onErr(err)})}
    (listeners[coll]=listeners[coll]||[]).push(cb);cb(lsGet(coll));
    return ()=>{listeners[coll]=(listeners[coll]||[]).filter(f=>f!==cb)};
  },
  async set(coll,id,data){
    if(S.db){await collRef(coll).doc(id).set(data);return}
    const arr=lsGet(coll).filter(d=>d.id!==id);arr.push(Object.assign({id},data));lsSet(coll,arr);lsEmit(coll);
  },
  async del(coll,id){
    if(S.db){await collRef(coll).doc(id).delete();return}
    lsSet(coll,lsGet(coll).filter(d=>d.id!==id));lsEmit(coll);
  }
};
async function useCap(name){try{return (window.claude&&window.claude.use)?await window.claude.use(name):null}catch(e){return null}}

async function boot(){
  route();render();
  const [db,user,sample,assets]=await Promise.all([useCap('db'),useCap('user'),useCap('sample'),useCap('assets')]);
  if(db){S.db=db;S.mode='db';let uid=null;try{uid=user?await user.id():null}catch(e){}
    if(uid){S.uid=uid;S.root=db.doc('data/users/'+uid+'/root')}}
  S.sample=sample;S.assets=assets;
  if(sample){try{const lim=await sample.limits();if(lim&&lim.images){S.canImages=true;S.imageTypes=lim.images.mediaTypes.join(',')||'image/*'}}catch(e){}}
  setSync();subscribeAll();
}
function setSync(){const el=document.getElementById('sync'),lbl=document.getElementById('syncLabel');
  if(S.mode==='db'){el.classList.add('on');lbl.textContent=S.root?'synced · private to you':'synced'}else{el.classList.remove('on');lbl.textContent='this device only'}}
function subscribeAll(){
  const timer=setTimeout(()=>{if(!S.loaded.meals)toast('Still reaching the data store. Showing what is cached.')},10000);
  store.subscribe('meals',rows=>{S.meals=rows;S.loaded.meals=true;clearTimeout(timer);render()},e=>{S.loaded.meals=true;toast('Could not load meals: '+(e&&e.code||'error'))});
  store.subscribe('labs',rows=>{S.labs=rows.sort((a,b)=>String(b.date).localeCompare(String(a.date)));S.loaded.labs=true;render()},()=>{S.loaded.labs=true});
  store.subscribe('insights',rows=>{S.insights=rows.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));S.loaded.insights=true;render()},()=>{S.loaded.insights=true});
  store.subscribe('settings',rows=>{S.settings=rows.find(r=>r.id==='profile')||null;S.loaded.settings=true;render()},()=>{S.loaded.settings=true});
}

// ---------- routing ----------
const VIEWS=['today','trends','labs','coach'];
function route(){const v=(location.hash||'#today').slice(1);S.view=VIEWS.includes(v)?v:'today'}
window.addEventListener('hashchange',()=>{route();render();window.scrollTo(0,0)});

// ---------- rendering ----------
function chartW(){const m=document.querySelector('main');return Math.max(300,Math.min(680,(m?m.clientWidth:400)-66))}
let resizeT=null;window.addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(render,150)});
function render(){
  for(const v of VIEWS){document.getElementById('view-'+v).hidden=(v!==S.view)}
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('active',a.dataset.v===S.view));
  const el=document.getElementById('view-'+S.view);
  el.innerHTML={today:renderToday,trends:renderTrends,labs:renderLabs,coach:renderCoach}[S.view]();
  wire(el);
}
function wire(el){
  el.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',onAction));
  const f=el.querySelector('form.add');if(f)f.addEventListener('submit',onAddSubmit);
  el.querySelectorAll('.chartwrap').forEach(wireChart);
}
setInterval(()=>{const el=document.getElementById('fastNow');if(el&&S.view==='today'){const f=fastingNow();el.textContent=f==null?'–':fmtDur(f)}},30000);

function howItWorks(){
  return h`<div class="card"><h2>How Macro Polo works</h2>
  <ol class="steps">
    <li><b>Tap the camera</b> and shoot your plate, the menu, a label or a receipt. Add a word if it helps ("double meat", "no cheese").</li>
    <li><b>Claude reads it right here</b> and logs calories, macros, cholesterol, sodium and a blood-sugar spike estimate, stamped with the time you ate. Got a detail wrong? Tap Edit on the entry and tell it what changed.</li>
    <li><b>Times build your windows</b>: first bite to last bite, overnight fast, and how long you have been fasting right now.</li>
    <li><b>Bloodwork screenshots</b> go to Claude in chat and land in Labs. Coach ties your meals back to them.</li>
  </ol></div>`;
}

// --- Today ---
function renderToday(){
  const date=S.date;const t=dayTotals(date);const tg=targets();const entries=dayEntries(date);const isToday=date===todayStr();
  const pct=Math.min(1,t.cal/tg.cal);const r=62,c=2*Math.PI*r;const over=t.cal>tg.cal;const left=tg.cal-t.cal;
  const macroRows=['protein','carbs','fat','fiber'].map(k=>{const n=NUTR.find(x=>x.k===k);const v=t[k],g=tg[k];const w=Math.min(100,g?v/g*100:0);
    return h`<div class="macro"><div class="lbl"><b><i style="background:${n.color}"></i>${n.l}</b><span class="num"><b>${fmtN(v,'g')}</b> / ${fmtN(g,'g')} g</span></div><div class="bar"><i style="width:${w}%;background:${n.color}"></i></div></div>`}).join('');
  const limits=['sugar','satfat','chol','sodium'].map(k=>{const n=NUTR.find(x=>x.k===k);const v=t[k],g=tg[k];const cls=ratioClass(v,g);const w=Math.min(100,g?v/g*100:0);
    return h`<div class="limit ${cls}"><div class="k">${n.l}</div><div class="v num">${fmtN(v,n.u)}<small> / ${fmtN(g,n.u)} ${n.u}</small></div><div class="bar"><i style="width:${w}%"></i></div></div>`}).join('');
  const win=dayWindow(date);const fast=isToday?fastingNow():null;
  const spikes=entries.map(e=>({e,g:glycemic(e)}));
  const worst=spikes.reduce((a,s)=>Math.max(a,{low:0,moderate:1,high:2}[s.g.impact]),0);
  const dayImpact=['low','moderate','high'][worst];const glSum=spikes.reduce((a,s)=>a+s.g.gl,0);

  return h`
  <div class="datebar">
    <button class="iconbtn" data-act="date" data-n="-1" aria-label="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="d">${isToday?'Today':fmtDate(date,{weekday:'long'})}<small>${fmtDate(date,{month:'long',day:'numeric',year:'numeric'})}</small></div>
    <button class="iconbtn" data-act="date" data-n="1" aria-label="Next day" ${isToday?'disabled style="opacity:.35"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="card hero">
    <div class="hero-top">
      <div class="ring" role="img" aria-label="${r0(t.cal)} of ${tg.cal} calories">
        <svg viewBox="0 0 150 150"><circle class="track" cx="75" cy="75" r="${r}"/><circle class="arc ${over?'over':''}" cx="75" cy="75" r="${r}" stroke-dasharray="${(pct*c).toFixed(1)} ${c.toFixed(1)}"/></svg>
        <div class="center"><b class="num">${r0(t.cal).toLocaleString()}</b><span>${over?r0(-left).toLocaleString()+' over target':r0(left).toLocaleString()+' left of '+tg.cal.toLocaleString()}</span></div>
      </div>
      <div class="macros">${macroRows}</div>
    </div>
    ${timeline(entries,win,isToday)}
    <div class="windows">
      <div class="win"><div class="k">Eating window</div><div class="v">${win?fmtDur(win.len):'–'}<small>${win?fmtTime(minsToTime(win.first))+' → '+fmtTime(minsToTime(win.last)):'no meals yet'}</small></div></div>
      <div class="win"><div class="k">Overnight fast</div><div class="v">${win&&win.overnight!=null?fmtDur(win.overnight):'–'}<small>${win&&win.overnight!=null?'last bite to first bite':'needs yesterday'}</small></div></div>
      ${isToday?h`<div class="win live"><div class="k">Fasting now</div><div class="v" id="fastNow">${fast==null?'–':fmtDur(fast)}</div><div class="tiny muted">since last bite</div></div>`
               :h`<div class="win"><div class="k">Meals</div><div class="v">${entries.length}<small>logged</small></div></div>`}
    </div>
  </div>
  <div class="card"><h2>Heart &amp; blood-sugar ceilings<span class="sub">daily limits</span></h2><div class="limits">${limits}</div></div>
  <div class="card"><h2>Blood-sugar impact<span class="sub">estimated glycemic load per meal</span></h2>
    ${entries.length?h`<div class="row between" style="margin-bottom:8px"><span class="chip ${dayImpact}">${IMPACT_LABEL[dayImpact]} day</span><span class="small muted">Load today <b class="num" style="color:var(--fg)">${glSum}</b> · ${glSum<80?'under 80 is a calm day':'over 80 is a rough day for insulin'}</span></div>${spikeChart(spikes)}`:h`<p class="small muted" style="margin:0">Nothing logged for this day yet.</p>`}
  </div>
  <div class="card"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Log<span class="sub">${entries.length?entries.length+' entries':''}</span></h2><button class="btn ghost sm" data-act="toggleAdd">${S.addOpen?'Close':'Add by hand'}</button></div>
    ${S.addOpen?addForm():''}
    ${entries.length?entryList(entries):h`<div class="empty"><b>Nothing logged ${isToday?'yet today':'this day'}</b><p>Tap the camera below and shoot what you are eating.</p></div>`}
  </div>
  ${(S.meals.length<=1&&S.loaded.meals)?howItWorks():''}`;
}

function timeline(entries,win,isToday){
  // 24h strip. Eating window shaded, one dot per entry sized by calories, colored by spike.
  const W=chartW(),H=58,padL=8,padR=8;
  const times=entries.map(e=>mins(e.time)).filter(v=>v!=null);
  let start=5*60,end=24*60;
  if(times.length){start=Math.min(start,Math.floor(Math.min(...times)/60)*60);}
  const x=m=>padL+(W-padL-padR)*(m-start)/(end-start);
  const y=24;
  const ticks=[];for(let m=Math.ceil(start/180)*180;m<=end;m+=180)ticks.push(m);
  const tickHtml=ticks.map(m=>h`<line x1="${x(m).toFixed(1)}" x2="${x(m).toFixed(1)}" y1="${y-6}" y2="${y+6}" class="axis"/><text x="${x(m).toFixed(1)}" y="${H-4}" text-anchor="middle">${m>=1440?'12am':(m/60)%12===0?'12pm':((m/60)%12)+(m<720?'am':'pm')}</text>`).join('');
  const band=win?h`<rect x="${x(win.first).toFixed(1)}" y="${y-9}" width="${Math.max(4,x(win.last)-x(win.first)).toFixed(1)}" height="18" rx="9" fill="var(--accent-soft)"/>`:'';
  const nowM=(()=>{const d=new Date();return d.getHours()*60+d.getMinutes()})();
  const nowLine=isToday&&nowM>=start?h`<line x1="${x(nowM).toFixed(1)}" x2="${x(nowM).toFixed(1)}" y1="${y-16}" y2="${y+16}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".6"/><text x="${x(nowM).toFixed(1)}" y="${y-19}" text-anchor="middle" style="fill:var(--fg)">now</text>`:'';
  const dots=entries.map(e=>{const m=mins(e.time);if(m==null)return'';const cal=entryTotals(e).cal;const rr=Math.max(5,Math.min(11,4+cal/90));const g=glycemic(e);const col={low:'var(--good)',moderate:'var(--warn)',high:'var(--crit)'}[g.impact];

}

function spikeChart(spikes){

  const max=Math.max(25,...spikes.map(s=>s.g.gl));const n=spikes.length;const bw=Math.min(52,(W-padL-padR)/n-8);

      <text x="${(x+bw/2).toFixed(1)}" y="${(y(s.g.gl)-5).toFixed(1)}" text-anchor="middle" style="fill:var(--fg);font-weight:600">${s.g.gl}</text>

  <div class="legend"><span><i style="background:var(--good)"></i>under 10 low</span><span><i style="background:var(--warn)"></i>10 to 20 moderate</span><span><i style="background:var(--crit)"></i>over 20 high</span></div>`;
}

// --- Trends ---
function lastDays(n){const out=[];for(let i=n-1;i>=0;i--)out.push(shiftDate(todayStr(),-i));return out}
function renderTrends(){
  const days=lastDays(S.range);const tg=targets();
  const rows=days.map(d=>({d,t:dayTotals(d),n:dayEntries(d).length,w:dayWindow(d)}));
  const logged=rows.filter(r=>r.n>0);
  const avg={};for(const n of NUTR)avg[n.k]=logged.length?logged.reduce((a,r)=>a+r.t[n.k],0)/logged.length:0;
  const wins=rows.filter(r=>r.w&&r.w.count>1);const avgWin=wins.length?wins.reduce((a,r)=>a+r.w.len,0)/wins.length:null;
  const fasts=rows.filter(r=>r.w&&r.w.overnight!=null);const avgFast=fasts.length?fasts.reduce((a,r)=>a+r.w.overnight,0)/fasts.length:null;
  const tight=wins.filter(r=>r.w.len<=8*60).length;
  const seg=[7,14,30].map(n=>h`<button class="${S.range===n?'on':''}" data-act="range" data-n="${n}">${n}d</button>`).join('');
  const tableRows=NUTR.map(n=>{const v=avg[n.k],g=tg[n.k];let cls='',verdict='';
    if(logged.length){const r=g?v/g:0;
      if(n.kind==='ceiling'){cls=ratioClass(v,g);verdict=r<0.8?'under':r<1?'close':'over'}
      else if(n.kind==='floor'){cls=r>=1?'good':r>=0.8?'warn':'crit';verdict=r>=1?'hit':r>=0.8?'close':'short'}
      else{cls=r<=1.05&&r>=0.85?'good':r<=1.15&&r>=0.7?'warn':'crit';verdict=r>1.05?'over':r<0.85?'under':'on target'}}
    return h`<tr><td>${n.l}</td><td class="n num">${logged.length?fmtN(v,n.u):'–'}</td><td class="n num muted">${fmtN(g,n.u)} ${n.u}</td><td>${verdict?h`<span class="chip ${cls==='good'?'normal':cls==='warn'?'borderline':'high'}">${verdict}</span>`:''}</td></tr>`}).join('');
  return h`
  <div class="row between"><h2 style="font-family:var(--display);font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em">Trends</h2><div class="seg">${seg}</div></div>
  <div class="card hero"><h2>Eating windows<span class="sub">first bite to last bite, each day</span></h2>
    <div class="stats3">
      <div class="stat"><div class="k">Avg window</div><div class="v">${avgWin!=null?fmtDur(avgWin):'–'}<small>${wins.length} days</small></div></div>
      <div class="stat"><div class="k">Avg overnight</div><div class="v">${avgFast!=null?fmtDur(avgFast):'–'}<small>fast</small></div></div>
      <div class="stat"><div class="k">Under 8h</div><div class="v">${wins.length?tight:'–'}<small>of ${wins.length||0} days</small></div></div>
    </div>
    ${wins.length||logged.length?h`<div class="chartwrap">${windowChart(rows)}</div>`:h`<p class="small muted" style="margin:10px 0 0">Log a couple of days and the windows show up here.</p>`}</div>
  <div class="card"><h2>Calories per day<span class="sub">dashed line is your ${tg.cal.toLocaleString()} kcal target</span></h2>
    ${logged.length?h`<div class="chartwrap">${calChart(rows,tg.cal)}</div>`:h`<p class="small muted" style="margin:0">No meals logged in this window yet.</p>`}</div>
  <div class="card"><h2>Macros per day<span class="sub">grams</span></h2>
    ${logged.length?h`<div class="chartwrap">${macroChart(rows)}</div><div class="legend"><span><i style="background:var(--protein)"></i>Protein</span><span><i style="background:var(--carbs)"></i>Carbs</span><span><i style="background:var(--fat)"></i>Fat</span></div>`:h`<p class="small muted" style="margin:0">No meals logged in this window yet.</p>`}</div>
  <div class="card"><h2>Daily averages<span class="sub">${logged.length} of ${days.length} days logged</span></h2>
    <div class="scroll"><table class="t"><thead><tr><th>Nutrient</th><th style="text-align:right">Avg</th><th style="text-align:right">Target</th><th></th></tr></thead><tbody>${tableRows}</tbody></table></div></div>`;
}
function windowChart(rows){
  const W=chartW(),padL=46,padR=8,rowH=rows.length>14?10:18,padT=18,padB=8;const H=padT+rowH*rows.length+padB;
  const start=4*60,end=24*60;const x=m=>padL+(W-padL-padR)*(m-start)/(end-start);
  const ticks=[];for(let m=start+120;m<=end;m+=240)ticks.push(m);
  const tickHtml=ticks.map(m=>h`<line class="grid" x1="${x(m).toFixed(1)}" x2="${x(m).toFixed(1)}" y1="${padT-4}" y2="${H-padB}"/><text x="${x(m).toFixed(1)}" y="${padT-8}" text-anchor="middle">${(m/60)%12===0?12:(m/60)%12}${m<720?'a':'p'}</text>`).join('');
  const every=rows.length>14?Math.ceil(rows.length/6):(rows.length>7?2:1);
  const bars=rows.map((r,i)=>{const yy=padT+rowH*i+rowH/2;const lbl=i%every===0||i===rows.length-1?h`<text x="${padL-6}" y="${(yy+4).toFixed(1)}" text-anchor="end">${esc(fmtShort(r.d))}</text>`:'';
    if(!r.w)return lbl;
    const x1=x(Math.max(start,r.w.first)),x2=x(r.w.last);const tip=esc(fmtShort(r.d))+': '+esc(fmtTime(minsToTime(r.w.first)))+' to '+esc(fmtTime(minsToTime(r.w.last)))+' ('+fmtDur(r.w.len)+')';
    const col=r.w.len<=8*60?'var(--accent)':r.w.len<=11*60?'var(--warn)':'var(--crit)';
    return lbl+h`<g data-tip="${tip}"><rect x="${x1.toFixed(1)}" y="${(yy-rowH*0.3).toFixed(1)}" width="${Math.max(6,x2-x1).toFixed(1)}" height="${(rowH*0.6).toFixed(1)}" rx="${(rowH*0.3).toFixed(1)}" fill="${col}"/></g>`}).join('');
  return h`<svg class="chart" viewBox="0 0 ${W} ${H}" style="margin-top:12px" aria-label="Eating window per day">${tickHtml}${bars}</svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>8h or less</span><span><i style="background:var(--warn)"></i>8 to 11h</span><span><i style="background:var(--crit)"></i>over 11h</span></div>`;
}
function calChart(rows,target){
  const W=chartW(),H=170,padL=40,padR=8,padT=12,padB=26;
  const max=Math.max(target*1.15,...rows.map(r=>r.t.cal))*1.05;const n=rows.length;const slot=(W-padL-padR)/n;const bw=Math.max(4,Math.min(28,slot-4));
  const y=v=>padT+(H-padT-padB)*(1-v/max);const ticks=niceTicks(max,4);
  const grid=ticks.map(v=>h`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${padL-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${v.toLocaleString()}</text>`).join('');
  const every=n>14?Math.ceil(n/7):(n>7?2:1);
  const bars=rows.map((r,i)=>{const x=padL+slot*i+(slot-bw)/2;const v=r.t.cal;const col=r.n?(v>target?'var(--crit)':'var(--accent)'):'var(--surface-3)';const hh=Math.max(r.n?2:0,y(0)-y(v));
    return h`<g data-tip="${esc(fmtShort(r.d))}: ${r0(v).toLocaleString()} kcal${r.n?'':' (not logged)'}"><rect x="${x.toFixed(1)}" y="${(y(0)-hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="3" fill="${col}"/><rect x="${(padL+slot*i).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${H-padT-padB}" fill="transparent"/>${i%every===0?h`<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(fmtShort(r.d))}</text>`:''}</g>`}).join('');
  return h`<svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="Calories per day">${grid}<line class="axis" x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}"/>${bars}<line class="target" x1="${padL}" x2="${W-padR}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}"/></svg>`;
}
function macroChart(rows){
  const W=chartW(),H=170,padL=40,padR=8,padT=12,padB=26;const keys=[['protein','var(--protein)'],['carbs','var(--carbs)'],['fat','var(--fat)']];
  const max=Math.max(50,...rows.map(r=>r.t.protein+r.t.carbs+r.t.fat))*1.08;const n=rows.length;const slot=(W-padL-padR)/n;const bw=Math.max(4,Math.min(28,slot-4));
  const y=v=>padT+(H-padT-padB)*(1-v/max);const ticks=niceTicks(max,4);
  const grid=ticks.map(v=>h`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${padL-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${v}g</text>`).join('');
  const every=n>14?Math.ceil(n/7):(n>7?2:1);
  const bars=rows.map((r,i)=>{const x=padL+slot*i+(slot-bw)/2;let acc=0;let segs='';
    for(const [k,col] of keys){const v=r.t[k];if(v<=0)continue;const y1=y(acc+v),y0=y(acc);segs+=h`<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,y0-y1-2).toFixed(1)}" rx="2" fill="${col}"/>`;acc+=v}
    return h`<g data-tip="${esc(fmtShort(r.d))}: P ${r0(r.t.protein)}g, C ${r0(r.t.carbs)}g, F ${r0(r.t.fat)}g"><rect x="${(padL+slot*i).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${H-padT-padB}" fill="transparent"/>${segs}${i%every===0?h`<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(fmtShort(r.d))}</text>`:''}</g>`}).join('');
  return h`<svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="Protein, carbs and fat per day">${grid}<line class="axis" x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}"/>${bars}</svg>`;
}
function niceTicks(max,count){const raw=max/count;const p=Math.pow(10,Math.floor(Math.log10(raw)));const step=[1,2,2.5,5,10].map(m=>m*p).find(s=>s>=raw)||raw;const out=[];for(let v=step;v<=max;v+=step)out.push(Math.round(v));return out}
function wireChart(wrap){
  let tip=null;
  wrap.addEventListener('pointerover',ev=>{const g=ev.target.closest('[data-tip]');if(!g)return;if(!tip){tip=document.createElement('div');tip.className='tooltip';wrap.appendChild(tip)}tip.textContent=g.dataset.tip;const r=g.getBoundingClientRect(),w=wrap.getBoundingClientRect();tip.style.left=(r.left-w.left+r.width/2)+'px';tip.style.top=(r.top-w.top)+'px';tip.hidden=false});
  wrap.addEventListener('pointerout',ev=>{if(tip&&!(ev.relatedTarget&&ev.relatedTarget.closest&&ev.relatedTarget.closest('[data-tip]')))tip.hidden=true});
}

// --- Labs ---
function labFlag(m){
  if(m.flag) return m.flag;
  const v=num(m.value);const lo=m.low==null?null:num(m.low),hi=m.high==null?null:num(m.high);
  if(hi!=null&&v>hi) return 'high';if(lo!=null&&v<lo) return 'low';if(hi!=null&&v>hi*0.92) return 'borderline';return 'normal';
}
function renderLabs(){
  if(!S.labs.length) return h`<div class="card"><div class="empty"><b>No bloodwork yet</b><p>Send your lab report screenshots to Claude in chat. Every marker lands here with its reference range, and Coach ties your meals back to it.</p></div></div>${howItWorks()}`;
  const panel=S.labs[Math.min(S.labIndex,S.labs.length-1)];const markers=Array.isArray(panel.markers)?panel.markers:[];
  const groups=[];for(const m of markers){const gname=m.group||'Other';let g=groups.find(x=>x.name===gname);if(!g){g={name:gname,items:[]};groups.push(g)}g.items.push(m)}
  const flagged=markers.filter(m=>['high','low'].includes(labFlag(m)));const border=markers.filter(m=>labFlag(m)==='borderline');
  const picker=S.labs.length>1?h`<div class="seg">${S.labs.map((l,i)=>h`<button class="${i===S.labIndex?'on':''}" data-act="lab" data-n="${i}">${esc(fmtShort(l.date))}</button>`).join('')}</div>`:'';
  return h`
  <div class="row between"><div><h2 style="font-family:var(--display);font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em">Bloodwork</h2><div class="small muted">${esc(fmtDate(panel.date,{month:'long',day:'numeric',year:'numeric'}))}${panel.lab?' · '+esc(panel.lab):''}</div></div>${picker}</div>
  <div class="card hero"><div class="stats3">
    <div class="stat"><div class="k">Out of range</div><div class="v" style="color:${flagged.length?'var(--crit)':'var(--good)'}">${flagged.length}</div></div>
    <div class="stat"><div class="k">Borderline</div><div class="v" style="color:${border.length?'var(--warn)':'var(--good)'}">${border.length}</div></div>
    <div class="stat"><div class="k">Markers</div><div class="v">${markers.length}</div></div>
  </div>${flagged.length?h`<div class="row" style="margin-top:10px">${flagged.map(m=>h`<span class="chip ${labFlag(m)==='low'?'low-lab':'high'}">${esc(m.name)} ${labFlag(m)}</span>`).join('')}</div>`:''}
  ${panel.summary?h`<div class="md small" style="margin-top:12px">${md(panel.summary)}</div>`:''}</div>
  ${groups.map(g=>h`<div class="card"><h2>${esc(g.name)}</h2><div class="labgroup">${g.items.map(markerRow).join('')}</div></div>`).join('')}`;
}
function markerRow(m){
  const f=labFlag(m);const v=num(m.value);const lo=m.low==null?null:num(m.low),hi=m.high==null?null:num(m.high);let rangeHtml='';
  if(lo!=null||hi!=null){const l=lo!=null?lo:0;const hh=hi!=null?hi:Math.max(v,l)*1.3;const span=Math.max(hh-l,1e-9);
    const dmin=Math.min(l-span*0.5,v-span*0.1,0);const dmax=Math.max(hh+span*0.5,v+span*0.1);const px=x=>Math.max(0,Math.min(100,(x-dmin)/(dmax-dmin)*100));
    rangeHtml=h`<div class="range"><span class="num">${lo!=null?lo:'<'}</span><div class="rb"><div class="ok" style="left:${px(l).toFixed(1)}%;width:${(px(hh)-px(l)).toFixed(1)}%"></div><div class="pin" style="left:${px(v).toFixed(1)}%"></div></div><span class="num">${hi!=null?hi:'>'}</span></div>`}
  return h`<div class="marker ${f}"><div class="n">${esc(m.name)} ${f!=='normal'?h`<span class="chip ${f==='low'?'low-lab':f}">${f}</span>`:''}</div><div class="v num">${esc(m.value)}<small>${esc(m.unit||'')}</small></div>${rangeHtml}${m.note?h`<div class="note">${esc(m.note)}</div>`:''}</div>`;
}

// --- Coach ---
const KIND_LABEL={daily:'Daily recap',weekly:'Weekly review',labs:'Bloodwork',meal:'Meal note',tip:'Tip',welcome:'Welcome'};
function renderCoach(){
  if(!S.insights.length) return h`<div class="card"><div class="empty"><b>No notes from Claude yet</b><p>Ask for a recap of your day or week in chat and it shows up here, with what your meals are likely doing to your cholesterol and blood sugar.</p></div></div>${howItWorks()}`;
  return S.insights.map(i=>h`<div class="card insight"><div class="meta"><span class="chip ${i.kind==='labs'?'accent':''}">${esc(KIND_LABEL[i.kind]||i.kind||'Note')}</span><span class="tiny muted">${i.date?esc(fmtDate(i.date,{month:'short',day:'numeric',year:'numeric'})):''}</span></div><h3>${esc(i.title||'')}</h3><div class="md">${md(i.body||'')}</div></div>`).join('');
}
function md(src){
  const lines=String(src).split(/\r?\n/);let out='',inList=false,para=[];
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const flush=()=>{if(para.length){out+='<p>'+inline(para.join(' '))+'</p>';para=[]}};
  for(const ln of lines){const l=ln.trim();
    if(/^[-*•]\s+/.test(l)){flush();if(!inList){out+='<ul>';inList=true}out+='<li>'+inline(l.replace(/^[-*•]\s+/,''))+'</li>';continue}
    if(inList){out+='</ul>';inList=false}
    if(!l){flush();continue}para.push(l)}
  flush();if(inList)out+='</ul>';return out;
}

// ---------- actions ----------
async function onAction(ev){
  const b=ev.currentTarget;const act=b.dataset.act;
  if(act==='date'){const d=shiftDate(S.date,+b.dataset.n);if(d>todayStr())return;S.date=d;S.confirmId=null;S.addOpen=false;render();return}
  if(act==='range'){S.range=+b.dataset.n;render();return}
  if(act==='lab'){S.labIndex=+b.dataset.n;render();return}
  if(act==='toggleAdd'){S.addOpen=!S.addOpen;render();if(S.addOpen){const f=document.getElementById('add_name');f&&f.focus()}return}
  if(act==='edit'){openEdit(b.dataset.id);return}
  if(act==='confirm'){S.confirmId=b.dataset.id;render();return}
  if(act==='cancel'){S.confirmId=null;render();return}
  if(act==='del'){const id=b.dataset.id;const e=S.meals.find(m=>m.id===id);S.confirmId=null;
    try{await store.del('meals',id);if(e&&e.photoId&&S.assets){S.assets.delete(e.photoId).catch(()=>{})}toast('Entry removed')}catch(err){toast('Could not remove: '+(err&&err.code||'error'))}render();return}
}
async function onAddSubmit(ev){
  ev.preventDefault();const f=ev.currentTarget;const fd=new FormData(f);const msg=document.getElementById('addMsg');
  const name=String(fd.get('name')||'').trim();if(!name){msg.textContent='Give it a name.';return}

    items:[Object.assign({name,qty:String(fd.get('qty')||'').trim()},Object.fromEntries(NUTR.map(n=>[n.k,num(fd.get(n.k))])))]};

  try{await store.set('meals',S.date+'-'+slug(name)+'-'+uid().slice(-4),doc);S.addOpen=false;toast('Saved to '+fmtShort(S.date));render()}
  catch(e){btn.disabled=false;msg.textContent='Could not save ('+(e&&e.code||'error')+').'}
}

async function downscale(file,maxPx){
  // Re-encode to JPEG so HEIC and huge photos become something Claude and the asset store accept.
  const bmp=await createImageBitmap(file).catch(()=>null);
  if(!bmp) return file;
  const sc=Math.min(1,maxPx/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',0.86));
}

      ${r&&r.questions&&r.questions.length?h`<button class="btn ghost sm" id="snapAnswer" ${snap.busy?'disabled':''}>Re-analyze with my answer</button>`:''}

function snapResult(r){
  const items=Array.isArray(r.items)?r.items:[];const tot={};for(const n of NUTR)tot[n.k]=items.reduce((a,it)=>a+num(it[n.k]),0);
  const g=glycemic({items,glycemic:r.glycemic});
  return h`<div class="result">
    <div class="head"><input id="snapName" value="${esc(r.name||'Meal')}" aria-label="Meal name"><div class="num" style="font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap">${r0(tot.cal)}<small class="muted" style="font-family:var(--body);font-weight:400;font-size:11px"> kcal</small></div></div>
    <div class="row"><span class="chip ${g.impact}">${IMPACT_LABEL[g.impact]}</span><span class="tiny muted">GL ${g.gl}</span>${r.confidence?h`<span class="chip">${esc(r.confidence)} confidence</span>`:''}</div>
    <div class="tiny muted" style="display:flex;gap:9px;flex-wrap:wrap">P <b style="color:var(--fg)">${fmtN(tot.protein,'g')}g</b> · C <b style="color:var(--fg)">${fmtN(tot.carbs,'g')}g</b> · F <b style="color:var(--fg)">${fmtN(tot.fat,'g')}g</b> · Fiber <b style="color:var(--fg)">${fmtN(tot.fiber,'g')}g</b> · Sugar <b style="color:var(--fg)">${fmtN(tot.sugar,'g')}g</b> · Sat <b style="color:var(--fg)">${fmtN(tot.satfat,'g')}g</b> · Chol <b style="color:var(--fg)">${fmtN(tot.chol,'mg')}mg</b> · Na <b style="color:var(--fg)">${fmtN(tot.sodium,'mg')}mg</b></div>
    <ul class="items">${items.map(it=>h`<li><span>${esc(it.name)}${it.qty?h` <span class="muted">${esc(it.qty)}</span>`:''}</span><span class="num muted">${r0(num(it.cal))} kcal</span></li>`).join('')}</ul>
    ${r.analysis?h`<div class="md small" style="border-left:3px solid var(--accent);padding-left:10px">${md(r.analysis)}</div>`:''}
    ${r.questions&&r.questions.length?h`<div class="questions"><b>Claude asks</b><ul>${r.questions.map(q=>h`<li>${esc(q)}</li>`).join('')}</ul><input id="snapReply" placeholder="Type your answer, then re-analyze" style="width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px"></div>`:''}
  </div>`;
}
function profileContext(){
  const tg=targets();const parts=['Daily targets: '+NUTR.map(n=>n.l+' '+tg[n.k]+n.u).join(', ')+'.'];
  if(S.labs.length){const p=S.labs[0];const fl=(p.markers||[]).filter(m=>['high','low','borderline'].includes(labFlag(m))).map(m=>m.name+' '+m.value+(m.unit||'')+' ('+labFlag(m)+')');if(fl.length)parts.push('Latest bloodwork flags ('+p.date+'): '+fl.join('; ')+'.')}
  return parts.join(' ');
}
async function analyze(withAnswer){
  if(!S.sample||!snap.blob||snap.busy)return;
  const note=(document.getElementById('snapNote')||{}).value||'';const time=(document.getElementById('snapTime')||{}).value||nowTime();
  const reply=withAnswer?((document.getElementById('snapReply')||{}).value||''):'';
  if(withAnswer&&!reply.trim()){toast('Type an answer first');return}
  const base='You are the nutrition logger inside Macro Polo, Adrian\'s food tracker. The attached photo is food he is eating or about to eat at '+fmtTime(time)+'.'+(note?' His note: "'+note.replace(/"/g,'\'')+'".':'')+
    ' Identify every distinct item and a realistic portion (restaurant portions are large). Estimate nutrition per item from standard USDA-style references.'+
    ' Reply with only JSON of this shape: {"name": "short meal name", "items": [{"name": "", "qty": "", "cal": 0, "protein": 0, "carbs": 0, "fat": 0, "fiber": 0, "sugar": 0, "satfat": 0, "chol": 0, "sodium": 0}], "analysis": "2 or 3 plain sentences: the biggest cholesterol, sodium or blood-sugar driver on the plate and one easy swap", "glycemic": {"gl": 0, "impact": "low|moderate|high", "note": "one short clause"}, "confidence": "high|medium|low", "questions": []}.'+
    ' Units: grams for protein, carbs, fat, fiber, sugar (added or free sugar only), satfat; milligrams for chol and sodium; numbers only, no unit strings. impact: gl under 10 low, 10 to 20 moderate, over 20 high. Put at most 2 short questions in "questions" only when an item, portion or preparation is genuinely unclear and changes the numbers a lot; otherwise leave it empty and commit to your best estimate. '+profileContext();
  if(withAnswer&&snap.result){snap.turns.push({role:'assistant',content:JSON.stringify(snap.result)});snap.turns.push({role:'user',content:'My answer to your question: "'+reply.replace(/"/g,'\'')+'". Re-estimate with the same photo and reply with the same JSON shape only, with "questions" empty.'})}
  else{snap.turns=[{role:'user',content:base}]}
  snap.busy=true;snap.result=null;snap.ctl=new AbortController();renderSnap();
  try{
    const r=await S.sample.json(snap.turns,{images:snap.blob,modelTier:'default',cache:false,signal:snap.ctl.signal,onText:({text})=>{const el=document.querySelector('.stream');if(el)el.innerHTML='<span class="pulse"></span>'+esc(text.slice(-160))}});
    if(!r||typeof r!=='object'||!Array.isArray(r.items))throw {code:'invalid_json',message:'no items'};
    snap.result=r;snap.busy=false;renderSnap();
  }catch(e){
    snap.busy=false;renderSnap();
    const code=e&&e.code||'error';
    const msg={not_granted:'You have not allowed this app to use Claude. Use the artifact menu to allow it, then try again.',rate_limited:'Claude is busy or you hit a usage limit. Try again in a bit, or save as waiting.',image_rejected:'That photo was rejected. Try a smaller or different shot.',invalid_json:'Claude answered but not in a form I could read. Try once more.',cancelled:''}[code];
    if(msg!=='')toast(msg||('Could not analyze ('+code+').'));
  }
}
async function saveSnap(){
  if(snap.busy||!snap.blob)return;
  const btn=document.getElementById('snapSave');btn.disabled=true;btn.textContent='Saving…';
  const name=(document.getElementById('snapName')||{}).value||(snap.result&&snap.result.name)||'Photo meal';
  const time=(document.getElementById('snapTime')||{}).value||nowTime();const note=(document.getElementById('snapNote')||{}).value||'';
  const r=snap.result;const date=todayStr();
  const doc={date,time,name:String(name).trim(),source:'photo',createdAt:new Date().toISOString(),userNote:note};
  if(r){doc.items=r.items.map(it=>Object.assign({name:String(it.name||''),qty:String(it.qty||'')},Object.fromEntries(NUTR.map(n=>[n.k,num(it[n.k])]))));doc.analysis=String(r.analysis||'');if(r.glycemic&&r.glycemic.impact)doc.glycemic={gl:num(r.glycemic.gl),impact:String(r.glycemic.impact),note:String(r.glycemic.note||'')};doc.confidence=r.confidence||''}
  else{doc.pending=true;doc.items=[]}
  try{
    if(S.assets){try{const up=await S.assets.upload(snap.blob);doc.photoId=up.id}catch(e){/* photo stays unsaved; the entry still logs */}}
    else if(S.mode==='local'){doc.photoData=await blobToDataUrl(snap.blob,640)}
    await store.set('meals',date+'-'+slug(doc.name)+'-'+uid().slice(-4),doc);
    closeSnap();S.date=date;toast(r?'Logged '+doc.name:'Saved. Send the photo to Claude in chat to fill it in.');render();
  }catch(e){btn.disabled=false;btn.textContent='Save to log';toast('Could not save ('+(e&&e.code||'error')+')')}
}
async function blobToDataUrl(blob,maxPx){const small=await downscale(blob,maxPx);return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(small)})}

  const src=S.meals.find(m=>m.id===id);if(!src)return;
  ed.id=id;ed.doc=JSON.parse(JSON.stringify(src));delete ed.doc.id;
  ed.items=(Array.isArray(src.items)&&src.items.length?src.items:[Object.assign(blankItem(),{name:src.name||'',qty:''},entryTotals(src))]).map(it=>Object.assign(blankItem(),it));

async function adjustWithClaude(){
  if(!S.sample||ed.busy)return;readEditForm();
  const ask=(document.getElementById('edAsk')||{}).value||'';if(!ask.trim()){toast('Say what to change first');return}
  const prompt='You are the nutrition logger inside Macro Polo, Adrian\'s food tracker. Here is a logged meal as JSON: '+JSON.stringify({name:ed.doc.name,time:ed.doc.time,items:ed.items})+
    '. Adrian says this correction: "'+ask.replace(/"/g,'\'')+'". Apply it: change, remove, add or rescale only the items the correction touches, keep everything else as it is, and recompute realistically from standard USDA-style references.'+
    ' Reply with only JSON: {"name": "", "items": [{"name": "", "qty": "", "cal": 0, "protein": 0, "carbs": 0, "fat": 0, "fiber": 0, "sugar": 0, "satfat": 0, "chol": 0, "sodium": 0}], "analysis": "2 or 3 plain sentences on the biggest cholesterol, sodium or blood-sugar driver and one easy swap", "glycemic": {"gl": 0, "impact": "low|moderate|high", "note": ""}}. Units: grams for protein, carbs, fat, fiber, sugar (added sugar only), satfat; milligrams for chol and sodium; numbers only. '+profileContext();
  ed.busy=true;renderEdit();
  try{
    const r=await S.sample.json(prompt,{modelTier:'default',cache:false,onText:({text})=>{const el=document.querySelector('.stream');if(el)el.innerHTML='<span class="pulse"></span>'+esc(text.slice(-160))}});
    if(!r||!Array.isArray(r.items))throw {code:'invalid_json'};
    ed.items=r.items.map(it=>Object.assign(blankItem(),{name:String(it.name||''),qty:String(it.qty||'')},Object.fromEntries(NUTR.map(n=>[n.k,num(it[n.k])]))));
    if(r.name)ed.doc.name=String(r.name);if(r.analysis)ed.doc.analysis=String(r.analysis);if(r.glycemic&&r.glycemic.impact)ed.doc.glycemic={gl:num(r.glycemic.gl),impact:String(r.glycemic.impact),note:String(r.glycemic.note||'')};
    ed.doc.notes=((ed.doc.notes?ed.doc.notes+' ':'')+'Corrected: '+ask.trim()).slice(0,300);
    ed.busy=false;renderEdit();toast('Adjusted. Check it, then save.');
  }catch(e){ed.busy=false;renderEdit();const code=e&&e.code||'error';toast(code==='not_granted'?'Allow this app to use Claude from the artifact menu, then try again.':code==='rate_limited'?'Claude is busy. Edit the numbers by hand or try again shortly.':'Could not adjust ('+code+'). Edit by hand instead.')}
}
async function saveEdit(){
  if(ed.busy)return;readEditForm();
  const btn=document.getElementById('edSave');btn.disabled=true;btn.textContent='Saving…';
  const doc=Object.assign({},ed.doc,{items:ed.items.filter(it=>it.name.trim()||num(it.cal)>0),updatedAt:new Date().toISOString()});
  if(!doc.name)doc.name='Meal';if(doc.items.length)doc.pending=false;
  try{await store.set('meals',ed.id,doc);document.getElementById('sheetRoot').innerHTML='';toast('Saved');render()}
  catch(e){btn.disabled=false;btn.textContent='Save changes';toast('Could not save ('+(e&&e.code||'error')+')')}
}

  root.innerHTML=h`<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-label="Targets"><div class="grab"></div>
    <h2>Daily targets</h2>
    <p class="small muted" style="margin:0 0 12px">Protein and fiber are floors to reach. Calories, carbs and fat are budgets. Sugar, saturated fat, cholesterol and sodium are ceilings. Claude tunes these from your bloodwork.</p>
    <form id="tgForm"><div class="targets">${NUTR.map(n=>h`<label>${n.l} (${n.u})<input type="number" step="any" min="0" name="${n.k}" id="tg_${n.k}" value="${tg[n.k]}"></label>`).join('')}</div>
    <div class="row between" style="margin-top:14px"><span class="tiny muted">${S.mode==='db'?(S.root?'Saved to your private log.':'Saved to the shared store.'):'Saved in this browser only.'}</span><span class="row"><button type="button" class="btn ghost sm" id="tgCancel">Cancel</button><button class="btn sm" type="submit">Save</button></span></div></form>
  </div></div>`;
  document.getElementById('sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg')root.innerHTML=''});
  document.getElementById('tgCancel').addEventListener('click',()=>root.innerHTML='');
  document.getElementById('tgForm').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const t={};for(const n of NUTR)t[n.k]=num(fd.get(n.k));
    const doc=Object.assign({},S.settings||{},{targets:t,updatedAt:new Date().toISOString()});delete doc.id;
    try{await store.set('settings','profile',doc);root.innerHTML='';toast('Targets saved');render()}catch(err){toast('Could not save targets: '+(err&&err.code||'error'))}});
}

let toastT=null;
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML=h`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>{r.innerHTML=''},3200)}

boot();
})();
</script>
